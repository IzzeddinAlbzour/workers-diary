<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2344">
<title>يوميات العمال</title>
<link rel="stylesheet" href="fonts/tajawal.css">
<style>
:root{
 --navy:#0b2344; --navy-2:#12305c; --blue:#1265dc; --blue-soft:#e9f1ff;
 --green:#0b9b68; --green-soft:#e8fbf2; --orange:#e0680f; --orange-soft:#fff1e6;
 --red:#c53030; --red-soft:#ffecec; --purple:#7854d8;
 --ink:#172033; --ink-2:#4a566b; --ink-3:#5d6b83;
 --bg:#f2f5fa; --line:#e6ebf3; --card:#ffffff;
 --r:16px; --shadow:0 2px 10px rgba(19,41,75,.07),0 1px 3px rgba(19,41,75,.05);
 --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:620px;margin:auto;min-height:100vh}

/* ---------- header ---------- */
header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 20px 24px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header p{margin:5px 0 0;color:#b9c6dd;font-size:13px;font-weight:500}
.headline{display:flex;align-items:center;gap:10px}
.headline .mark{width:34px;height:34px;flex:none;background:#f7b500;border-radius:10px;display:grid;place-items:center;color:var(--navy)}
#pagewrap{animation:pagein .28s var(--ease)}
@keyframes pagein{from{transform:translateY(7px)}to{transform:none}}

main{padding:16px 14px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}

/* ---------- stats ---------- */
.stat{display:flex;flex-direction:column;gap:8px}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.stat span.lbl{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:-6px}
.tint-blue{background:var(--blue-soft);color:var(--blue)}
.tint-green{background:var(--green-soft);color:var(--green)}
.tint-orange{background:var(--orange-soft);color:var(--orange)}
.tint-purple{background:#f0ebfc;color:var(--purple)}
.tint-red{background:var(--red-soft);color:var(--red)}

/* ---------- buttons ---------- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.primary{background:var(--blue);color:#fff}
.primary:hover{background:#0f57be}
.secondary{background:var(--blue-soft);color:var(--blue)}
.secondary:hover{background:#dce9ff}
.danger{background:var(--red-soft);color:var(--red)}
.success{background:var(--green-soft);color:#07865a}
.wide{width:100%}
.iconbtn{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue)}
.iconbtn.del:hover{background:var(--red-soft);color:var(--red)}

/* ---------- forms ---------- */
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid #d9e1ee;border-radius:11px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}
.field textarea{min-height:76px;resize:vertical}
.field.err input,.field.err select{border-color:var(--red);box-shadow:0 0 0 3px rgba(197,48,48,.11)}
.field .msg{display:none;color:var(--red);font-size:12.5px;font-weight:600;margin-top:5px}
.field.err .msg{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;position:relative}
.search svg{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:11px 40px 11px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}

/* ---------- lists ---------- */
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0 0 3px;font-size:15px;font-weight:700}
.item small{color:var(--ink-3);font-size:12.5px}
.amount{font-weight:800}
.rowicons{display:flex;gap:2px;align-items:center}
.avatar{width:40px;height:40px;flex:none;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:16px}
.lead{display:flex;align-items:center;gap:11px;min-width:0}
.lead .tx{min-width:0}
.lead .tx h3,.lead .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.muted{color:var(--ink-3);font-size:12.5px;font-weight:500}
.total{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-.01em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- empty states ---------- */
.empty{text-align:center;color:var(--ink-3);padding:30px 16px}
.empty .eic{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:#9aa7bd}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:3px}
.empty p{margin:0 0 12px;font-size:13px}

/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{color:#77839a;padding:8px 2px 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s}
nav button svg{transition:transform .18s var(--ease)}
nav button.active{color:var(--blue);font-weight:800}
nav button.active svg{transform:translateY(-1px)}
nav button.active::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--blue)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,17,34,.55);z-index:30;padding:18px;overflow:auto;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{max-width:520px;margin:26px auto;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(8,17,34,.35);animation:sheetin .26s var(--ease)}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet .head{background:var(--navy);color:#fff;padding:16px 18px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sheet .head .x{color:#b9c6dd;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.sheet .head .x:hover{background:rgba(255,255,255,.12);color:#fff}
.sheet .body{padding:16px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:74px;left:0;right:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
#toast .t{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(8,17,34,.3);display:flex;gap:8px;align-items:center;animation:toastin .3s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- print ---------- */
@media print{
 nav,header,.toolbar,.actions,button,#toast{display:none!important}
 body,.app{background:#fff}
 .card{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
 main{padding:0}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="headline">
  <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v2h14v-2a7 7 0 0 0-7-7Z"/><path d="M3 15h18"/><path d="M12 3v4"/></svg></span>
  <div><h1 id="title">يوميات العمال</h1><p id="subtitle">إدارة العمال والمشاريع والحسابات</p></div>
 </div>
</header>
<main><div id="pagewrap"><div id="main"></div></div>
<p style="text-align:center;color:#9aa7bd;font-size:12px;font-weight:500;margin:4px 0 0">
 صنع بواسطة Ezz Al-Bzour © 2026<br>
 واتساب <span class="num" dir="ltr">+972 56 947 2423</span>
</p></main>
<nav id="nav"></nav>
</div>
<div id="toast"></div>
<script>
/* ---------- icon system: one stroke family (24px grid, 2px, round) ---------- */
const I = (d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic = {
 home: d=>I('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',d),
 users: d=>I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6"/><path d="M18.5 15.4c1.6.8 2.7 2.4 3 4.6"/>',d),
 crane: d=>I('<path d="M4 21h9"/><path d="M8.5 21V8"/><path d="M4.5 8h4"/><path d="M8.5 8 19 5.5"/><path d="M19 5.5V12"/><path d="M17.5 12h3"/><path d="M19 12v3.2"/><circle cx="19" cy="16.7" r="1.5"/><path d="M8.5 12h-4v9"/>',d),
 chart: d=>I('<path d="M4 4v16h16"/><path d="M8.5 16v-5"/><path d="M13 16V7.5"/><path d="M17.5 16v-3"/>',d),
 wallet: d=>I('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><path d="M16 13.5h4"/>',d),
 plus: d=>I('<path d="M12 5v14"/><path d="M5 12h14"/>',d),
 pay: d=>I('<rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M6.5 6V4.5"/>',d),
 edit: d=>I('<path d="M4 20h4.5L20 8.5a2.1 2.1 0 0 0-3-3L5.5 17 4 20Z"/><path d="M14.5 8 16 9.5"/>',d),
 trash: d=>I('<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/>',d),
 search: d=>I('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/>',d),
 print: d=>I('<path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',d),
 down: d=>I('<path d="M12 4v11"/><path d="m7 11 5 4.5L17 11"/><path d="M5 20h14"/>',d),
 up: d=>I('<path d="M12 20V9"/><path d="m7 13 5-4.5L17 13"/><path d="M5 4h14"/>',d),
 warn: d=>I('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/>',d),
 check: d=>I('<path d="m4.5 12.5 5 5L19.5 7"/>',d),
 x: d=>I('<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',d),
 cal: d=>I('<rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/>',d)
};

const PAGES=[
 {id:'home', title:'يوميات العمال', icon:ic.home},
 {id:'workers', title:'العمال', icon:ic.users},
 {id:'projects', title:'المشاريع', icon:ic.crane},
 {id:'reports', title:'التقارير', icon:ic.chart},
 {id:'accounts', title:'الحسابات', icon:ic.wallet}
];
const LABELS={home:'الرئيسية',workers:'العمال',projects:'المشاريع',reports:'التقارير',accounts:'الحسابات'};

const KEY='workersDiary_v1';
let db={workers:[],projects:[],logs:[],payments:[]};
let page='home';
const $=s=>document.querySelector(s);
const money=n=>`<span class="num">${Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})} ₪</span>`;
const today=()=>new Date().toISOString().slice(0,10);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
/* accept Arabic-Indic digits (٠١٢٣ / ۰۱۲۳) and normalize to Latin so Number() works */
function digits(el){
 const v=el.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^0-9.]/g,'');
 if(v!==el.value)el.value=v;
}
function workerName(id){return db.workers.find(x=>x.id==id)?.name||'غير محدد'}
function projectName(id){return db.projects.find(x=>x.id==id)?.name||'غير محدد'}
function stats(){
 const earned=db.logs.reduce((a,l)=>a+Number(l.wage||0),0);
 const paid=db.payments.reduce((a,p)=>a+Number(p.amount||0),0);
 return {workers:db.workers.length,projects:db.projects.length,days:db.logs.length,earned,paid,balance:earned-paid};
}
function toast(msg){
 $('#toast').innerHTML=`<div class="t">${ic.check(16)} ${esc(msg)}</div>`;
 clearTimeout(toast._t); toast._t=setTimeout(()=>{$('#toast').innerHTML=''},2200);
}
function emptyState(icon,title,hint,btn){
 return `<div class="empty"><div class="eic">${icon(26)}</div><b>${title}</b><p>${hint}</p>${btn||''}</div>`;
}
function render(){
 $('#title').textContent=PAGES.find(p=>p.id===page).title;
 $('#subtitle').textContent='إدارة العمال والمشاريع والحسابات';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 ({home,workers,projects,reports,accounts})[page]();
 const w=$('#pagewrap'); w.style.animation='none'; void w.offsetWidth; w.style.animation='';
}

/* ---------- pages ---------- */
function home(){
 const s=stats();
 $('#main').innerHTML=`
 <div class="grid">
  <div class="card stat"><span class="ic tint-blue">${ic.users(20)}</span><b class="num">${s.workers}</b><span class="lbl">عدد العمال</span></div>
  <div class="card stat"><span class="ic tint-green">${ic.cal(20)}</span><b class="num">${db.logs.filter(x=>x.date===today()).length}</b><span class="lbl">يوميات اليوم</span></div>
  <div class="card stat"><span class="ic tint-orange">${ic.crane(20)}</span><b class="num">${s.projects}</b><span class="lbl">المشاريع</span></div>
  <div class="card stat"><span class="ic tint-purple">${ic.wallet(20)}</span><b>${money(s.balance)}</b><span class="lbl">الرصيد المستحق</span></div>
 </div>
 <div class="card"><h3>إجراءات سريعة</h3><div class="actions">
 <button class="btn primary" onclick="newLog()">${ic.plus(17)} تسجيل يومية</button>
 <button class="btn secondary" onclick="newWorker()">${ic.users(17)} إضافة عامل</button>
 <button class="btn secondary" onclick="newProject()">${ic.crane(17)} إضافة مشروع</button>
 <button class="btn success" onclick="newPayment()">${ic.pay(17)} تسجيل دفعة</button>
 </div></div>
 <div class="card"><h3>آخر اليوميات</h3>${recentLogs()}</div>`;
}
function logRow(l,withActions){
 return `<div class="item"><div class="lead"><div class="tx"><h3>${esc(workerName(l.workerId))}</h3><small>${esc(projectName(l.projectId))} • <span class="num">${esc(l.date)}</span> • <span class="num">${esc(l.hours||0)}</span> ساعة${l.type?' • '+esc(l.type):''}</small></div></div>
 <div class="rowicons"><span class="amount">${money(l.wage)}</span>${withActions?`
  <button class="iconbtn" title="تعديل" onclick="editLog('${l.id}')">${ic.edit(16)}</button>
  <button class="iconbtn del" title="حذف" onclick="delLog('${l.id}')">${ic.trash(16)}</button>`:''}
 </div></div>`;
}
function recentLogs(){
 const arr=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 if(!arr.length)return emptyState(ic.cal,'لا توجد يوميات بعد','سجّل أول يومية عمل لتظهر هنا',`<button class="btn primary" onclick="newLog()">${ic.plus(16)} تسجيل يومية</button>`);
 return arr.map(l=>logRow(l,true)).join('');
}
function workers(){
 $('#main').innerHTML=`<div class="toolbar"><div class="search">${ic.search(17)}<input id="ws" placeholder="بحث بالاسم أو رقم الهاتف..." oninput="filterWorkers()"></div><button class="btn primary" onclick="newWorker()">${ic.plus(17)}</button></div><div id="workerList"></div>`;
 filterWorkers();
}
function filterWorkers(){
 const q=($('#ws')?.value||'').toLowerCase();
 const list=db.workers.filter(w=>w.name.toLowerCase().includes(q)||String(w.phone||'').includes(q));
 $('#workerList').innerHTML=list.length?list.map(w=>{
  const earned=db.logs.filter(l=>l.workerId===w.id).reduce((a,l)=>a+Number(l.wage||0),0);
  const paid=db.payments.filter(p=>p.workerId===w.id).reduce((a,p)=>a+Number(p.amount||0),0);
  return `<div class="card"><div class="item"><div class="lead"><span class="avatar">${esc(w.name.trim().charAt(0))}</span><div class="tx"><h3>${esc(w.name)}</h3><small>${esc(w.job||'عامل')}${w.phone?' • <span class="num">'+esc(w.phone)+'</span>':''}</small></div></div>
   <div class="rowicons">
    <button class="iconbtn" title="تعديل" onclick="editWorker('${w.id}')">${ic.edit(16)}</button>
    <button class="iconbtn del" title="حذف" onclick="delWorker('${w.id}')">${ic.trash(16)}</button>
   </div></div>
   <div class="row"><div><span class="muted">المستحق</span><br><b style="color:var(--green)">${money(earned)}</b></div><div><span class="muted">السلف/الدفعات</span><br><b style="color:var(--orange)">${money(paid)}</b></div></div><hr>
   <div class="item" style="padding:0;border:0"><b>الرصيد: ${money(earned-paid)}</b><button class="btn secondary" onclick="newLog('${w.id}')">${ic.plus(15)} يومية</button></div></div>`
 }).join(''):(db.workers.length
   ?`<div class="card">${emptyState(ic.search,'لا نتائج مطابقة','جرّب اسمًا أو رقمًا آخر')}</div>`
   :`<div class="card">${emptyState(ic.users,'لا يوجد عمال بعد','أضف أول عامل لبدء تسجيل اليوميات',`<button class="btn primary" onclick="newWorker()">${ic.plus(16)} إضافة عامل</button>`)}</div>`);
}
function projects(){
 $('#main').innerHTML=`<div class="toolbar"><div style="flex:1"></div><button class="btn primary" onclick="newProject()">${ic.plus(16)} مشروع</button></div><div id="projectList"></div>`;
 $('#projectList').innerHTML=db.projects.length?db.projects.map(p=>{
  const logs=db.logs.filter(l=>l.projectId===p.id), total=logs.reduce((a,l)=>a+Number(l.wage||0),0);
  return `<div class="card"><div class="item" style="padding-top:0"><div class="lead"><span class="avatar tint-orange">${ic.crane(19)}</span><div class="tx"><h3>${esc(p.name)}</h3><small>${esc(p.location||'')}${p.start?' • <span class="num">'+esc(p.start)+'</span>':''}</small></div></div>
   <div class="rowicons">
    <button class="iconbtn" title="تعديل" onclick="editProject('${p.id}')">${ic.edit(16)}</button>
    <button class="iconbtn del" title="حذف" onclick="delProject('${p.id}')">${ic.trash(16)}</button>
   </div></div>
   <div class="row"><div><span class="muted">اليوميات</span><br><b class="num">${logs.length}</b></div><div><span class="muted">أجور مسجلة</span><br><b>${money(total)}</b></div></div></div>`;
 }).join(''):`<div class="card">${emptyState(ic.crane,'لا توجد مشاريع بعد','أضف مشروعًا لربط اليوميات به',`<button class="btn primary" onclick="newProject()">${ic.plus(16)} إضافة مشروع</button>`)}</div>`;
}
function reports(){
 const s=stats();
 const byWorker=db.workers.map(w=>{const ls=db.logs.filter(l=>l.workerId===w.id);return {w,days:ls.length,hours:ls.reduce((a,l)=>a+Number(l.hours||0),0),earned:ls.reduce((a,l)=>a+Number(l.wage||0),0),paid:db.payments.filter(p=>p.workerId===w.id).reduce((a,p)=>a+Number(p.amount||0),0)}}).filter(x=>x.days||x.paid);
 $('#main').innerHTML=`<div class="card"><h3>ملخص التقرير</h3><div class="grid">
 <div><span class="muted">الأيام</span><br><b class="num">${db.logs.length}</b></div><div><span class="muted">الساعات</span><br><b class="num">${db.logs.reduce((a,l)=>a+Number(l.hours||0),0)}</b></div>
 <div><span class="muted">المستحقات</span><br><b style="color:var(--green)">${money(s.earned)}</b></div><div><span class="muted">المدفوع</span><br><b style="color:var(--orange)">${money(s.paid)}</b></div></div></div>
 <div class="card"><h3>كشف العمال</h3>${byWorker.length?byWorker.map(x=>`<div class="item"><div class="lead"><span class="avatar">${esc(x.w.name.trim().charAt(0))}</span><div class="tx"><b>${esc(x.w.name)}</b><br><small><span class="num">${x.days}</span> يوم • <span class="num">${x.hours}</span> ساعة</small></div></div><div style="text-align:left"><b style="color:var(--green)">${money(x.earned)}</b><br><small>صافي ${money(x.earned-x.paid)}</small></div></div>`).join(''):emptyState(ic.chart,'لا توجد بيانات','سجّل يوميات ودفعات لعرض الكشف')}</div>
 <div class="actions"><button class="btn primary" onclick="window.print()">${ic.print(17)} طباعة</button><button class="btn secondary" onclick="exportData()">${ic.down(17)} تصدير البيانات</button></div>`;
}
function accounts(){
 const s=stats();
 $('#main').innerHTML=`<div class="grid"><div class="card stat"><span class="ic tint-green">${ic.chart(20)}</span><b style="color:var(--green)">${money(s.earned)}</b><span class="lbl">إجمالي المستحقات</span></div><div class="card stat"><span class="ic tint-orange">${ic.pay(20)}</span><b style="color:var(--orange)">${money(s.paid)}</b><span class="lbl">إجمالي المدفوع</span></div></div>
 <div class="card"><h3>الرصيد الإجمالي</h3><div class="total">${money(s.balance)}</div><p class="muted" style="margin:4px 0 12px">المستحقات المسجلة ناقص الدفعات والسلف.</p><button class="btn success wide" onclick="newPayment()">${ic.plus(16)} تسجيل دفعة / سلفة</button></div>
 <div class="card"><h3>آخر الدفعات</h3>${db.payments.slice(-10).reverse().map(p=>`<div class="item"><div class="lead"><div class="tx"><b>${esc(workerName(p.workerId))}</b><br><small><span class="num">${esc(p.date)}</span> • ${esc(p.note||'دفعة')}</small></div></div>
  <div class="rowicons"><b style="color:var(--orange)">${money(p.amount)}</b>
   <button class="iconbtn" title="تعديل" onclick="editPayment('${p.id}')">${ic.edit(16)}</button>
   <button class="iconbtn del" title="حذف" onclick="delPayment('${p.id}')">${ic.trash(16)}</button>
  </div></div>`).join('')||emptyState(ic.pay,'لا توجد دفعات','سجّل دفعة أو سلفة لتظهر هنا')}</div>
 <div class="card"><h3>النسخ الاحتياطي</h3><div class="actions"><button class="btn secondary" onclick="exportData()">${ic.down(16)} تصدير</button><button class="btn secondary" onclick="restoreData()">${ic.up(16)} استعادة</button></div></div>
 <div class="card"><button class="btn danger wide" onclick="resetData()">${ic.warn(17)} حذف كل البيانات</button></div>`;
}

/* ---------- modal + validation ---------- */
function modal(title,body,onSave,saveLabel='حفظ'){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()" title="إغلاق">${ic.x(17)}</button></div><div class="body">${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">${saveLabel}</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#saveBtn').onclick=()=>{if(onSave())closeModal()};
 const f=wrap.querySelector('input,select,textarea'); if(f)f.focus();
}
function closeModal(){$('#modal')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function fieldErr(id,msg){
 const el=$('#'+id); const f=el.closest('.field'); f.classList.add('err');
 f.querySelector('.msg').textContent=msg;
 el.addEventListener('input',()=>f.classList.remove('err'),{once:true});
 el.focus(); return false;
}
const F=(id,label,inner)=>`<div class="field"><label for="${id}">${label}</label>${inner}<div class="msg"></div></div>`;

function confirmBox(title,body,onYes,yesLabel='حذف'){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()">${ic.x(17)}</button></div><div class="body"><div style="display:flex;gap:12px;align-items:flex-start"><span class="tint-red" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none">${ic.warn(19)}</span><p style="margin:6px 0 14px">${body}</p></div><div class="actions"><button class="btn danger" id="yesBtn">${yesLabel}</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#yesBtn').onclick=()=>{onYes();closeModal()};
}

/* ---------- workers CRUD ---------- */
function workerForm(w={}){
 return F('n','اسم العامل *',`<input id="n" value="${esc(w.name||'')}">`)
 +`<div class="row">${F('p','رقم الهاتف',`<input id="p" inputmode="tel" value="${esc(w.phone||'')}">`)}${F('j','المهنة',`<input id="j" placeholder="سباك، كهربائي..." value="${esc(w.job||'')}">`)}</div>`
 +F('w','الأجرة اليومية الافتراضية',`<input id="w" type="text" inputmode="decimal" oninput="digits(this)" value="${w.defaultWage??''}">`);
}
function newWorker(){
 modal('إضافة عامل',workerForm(),()=>{
  if(!$('#n').value.trim())return fieldErr('n','اكتب اسم العامل');
  const w={id:crypto.randomUUID(),name:$('#n').value.trim(),phone:$('#p').value,job:$('#j').value,defaultWage:Number($('#w').value||0)};
  db.workers.push(w);window.api.addWorker(w);render();toast('تمت إضافة العامل');return true});
}
function editWorker(id){
 const w=db.workers.find(x=>x.id===id);
 modal('تعديل عامل',workerForm(w),()=>{
  if(!$('#n').value.trim())return fieldErr('n','اكتب اسم العامل');
  Object.assign(w,{name:$('#n').value.trim(),phone:$('#p').value,job:$('#j').value,defaultWage:Number($('#w').value||0)});
  window.api.updateWorker(w);render();toast('تم حفظ التعديل');return true});
}
function delWorker(id){
 const w=db.workers.find(x=>x.id===id);
 const nLogs=db.logs.filter(l=>l.workerId===id).length, nPays=db.payments.filter(p=>p.workerId===id).length;
 confirmBox('حذف عامل',`سيتم حذف <b>${esc(w.name)}</b> مع كل يومياته (<span class="num">${nLogs}</span>) ودفعاته (<span class="num">${nPays}</span>). لا يمكن التراجع.`,()=>{
  db.workers=db.workers.filter(x=>x.id!==id);
  db.logs=db.logs.filter(l=>l.workerId!==id);
  db.payments=db.payments.filter(p=>p.workerId!==id);
  window.api.deleteWorker(id);render();toast('تم حذف العامل');});
}

/* ---------- projects CRUD ---------- */
function projectForm(p={}){
 return F('n','اسم المشروع *',`<input id="n" value="${esc(p.name||'')}">`)
 +F('l','الموقع',`<input id="l" value="${esc(p.location||'')}">`)
 +F('d','تاريخ البداية',`<input id="d" type="date" value="${esc(p.start||today())}">`);
}
function newProject(){
 modal('إضافة مشروع',projectForm(),()=>{
  if(!$('#n').value.trim())return fieldErr('n','اكتب اسم المشروع');
  const p={id:crypto.randomUUID(),name:$('#n').value.trim(),location:$('#l').value,start:$('#d').value};
  db.projects.push(p);window.api.addProject(p);render();toast('تمت إضافة المشروع');return true});
}
function editProject(id){
 const p=db.projects.find(x=>x.id===id);
 modal('تعديل مشروع',projectForm(p),()=>{
  if(!$('#n').value.trim())return fieldErr('n','اكتب اسم المشروع');
  Object.assign(p,{name:$('#n').value.trim(),location:$('#l').value,start:$('#d').value});
  window.api.updateProject(p);render();toast('تم حفظ التعديل');return true});
}
function delProject(id){
 const p=db.projects.find(x=>x.id===id);
 confirmBox('حذف مشروع',`سيتم حذف <b>${esc(p.name)}</b>. اليوميات المسجلة عليه تبقى محفوظة بدون مشروع.`,()=>{
  db.projects=db.projects.filter(x=>x.id!==id);
  window.api.deleteProject(id);render();toast('تم حذف المشروع');});
}

/* ---------- logs CRUD ---------- */
function logForm(l={},preWorker=''){
 const wid=l.workerId||preWorker;
 const opts=db.workers.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('');
 const propts=db.projects.map(p=>`<option value="${p.id}" ${p.id===l.projectId?'selected':''}>${esc(p.name)}</option>`).join('');
 return F('wi','العامل *',`<select id="wi"><option value="">اختر العامل</option>${opts}</select>`)
 +F('pi','المشروع',`<select id="pi"><option value="">اختر المشروع</option>${propts}</select>`)
 +`<div class="row">${F('dt','التاريخ',`<input id="dt" type="date" value="${esc(l.date||today())}">`)}${F('hr','عدد الساعات',`<input id="hr" type="text" inputmode="decimal" oninput="digits(this)" value="${l.hours??8}">`)}</div>`
 +`<div class="row">${F('wg','الأجرة اليومية *',`<input id="wg" type="text" inputmode="decimal" oninput="digits(this)" value="${l.wage??''}">`)}${l.id?'':F('pay','سلفة/دفعة اليوم',`<input id="pay" type="text" inputmode="decimal" oninput="digits(this)" value="0">`)}</div>`
 +F('type','نوع العمل',`<input id="type" placeholder="سباكة، كهرباء، جبصين..." value="${esc(l.type||'')}">`)
 +F('note','ملاحظات',`<textarea id="note">${esc(l.note||'')}</textarea>`);
}
function readLogForm(){
 const wid=$('#wi').value;if(!wid){fieldErr('wi','اختر العامل');return null}
 const worker=db.workers.find(w=>w.id===wid);const wage=Number($('#wg').value||worker.defaultWage||0);
 if(!wage){fieldErr('wg','اكتب الأجرة');return null}
 return {workerId:wid,projectId:$('#pi').value,date:$('#dt').value,hours:Number($('#hr').value||0),wage,type:$('#type').value,note:$('#note').value};
}
function newLog(workerId=''){
 modal('تسجيل يومية جديدة',logForm({},workerId),()=>{
  const v=readLogForm();if(!v)return false;
  const l={id:crypto.randomUUID(),...v};
  db.logs.push(l);window.api.addLog(l);
  const pay=Number($('#pay').value||0);
  if(pay){const pm={id:crypto.randomUUID(),workerId:v.workerId,date:v.date,amount:pay,note:'سلفة من اليومية'};db.payments.push(pm);window.api.addPayment(pm);}
  render();toast('تم تسجيل اليومية');return true});
}
function editLog(id){
 const l=db.logs.find(x=>x.id===id);
 modal('تعديل يومية',logForm(l),()=>{
  const v=readLogForm();if(!v)return false;
  Object.assign(l,v);window.api.updateLog(l);render();toast('تم حفظ التعديل');return true});
}
function delLog(id){
 const l=db.logs.find(x=>x.id===id);
 confirmBox('حذف يومية',`حذف يومية <b>${esc(workerName(l.workerId))}</b> بتاريخ <span class="num">${esc(l.date)}</span> (${money(l.wage)})؟`,()=>{
  db.logs=db.logs.filter(x=>x.id!==id);
  window.api.deleteLog(id);render();toast('تم حذف اليومية');});
}

/* ---------- payments CRUD ---------- */
function paymentForm(p={}){
 const opts=db.workers.map(w=>`<option value="${w.id}" ${w.id===p.workerId?'selected':''}>${esc(w.name)}</option>`).join('');
 return F('wi','العامل *',`<select id="wi"><option value="">اختر العامل</option>${opts}</select>`)
 +`<div class="row">${F('am','المبلغ *',`<input id="am" type="text" inputmode="decimal" oninput="digits(this)" value="${p.amount??''}">`)}${F('dt','التاريخ',`<input id="dt" type="date" value="${esc(p.date||today())}">`)}</div>`
 +F('note','ملاحظات',`<input id="note" placeholder="سلفة، راتب، دفعة..." value="${esc(p.note||'')}">`);
}
function newPayment(){
 modal('تسجيل دفعة / سلفة',paymentForm(),()=>{
  if(!$('#wi').value)return fieldErr('wi','اختر العامل');
  if(!Number($('#am').value))return fieldErr('am','اكتب المبلغ');
  const p={id:crypto.randomUUID(),workerId:$('#wi').value,amount:Number($('#am').value),date:$('#dt').value,note:$('#note').value};
  db.payments.push(p);window.api.addPayment(p);render();toast('تم تسجيل الدفعة');return true});
}
function editPayment(id){
 const p=db.payments.find(x=>x.id===id);
 modal('تعديل دفعة',paymentForm(p),()=>{
  if(!$('#wi').value)return fieldErr('wi','اختر العامل');
  if(!Number($('#am').value))return fieldErr('am','اكتب المبلغ');
  Object.assign(p,{workerId:$('#wi').value,amount:Number($('#am').value),date:$('#dt').value,note:$('#note').value});
  window.api.updatePayment(p);render();toast('تم حفظ التعديل');return true});
}
function delPayment(id){
 const p=db.payments.find(x=>x.id===id);
 confirmBox('حذف دفعة',`حذف دفعة <b>${esc(workerName(p.workerId))}</b> بمبلغ ${money(p.amount)}؟`,()=>{
  db.payments=db.payments.filter(x=>x.id!==id);
  window.api.deletePayment(id);render();toast('تم حذف الدفعة');});
}

/* ---------- backup / reset ---------- */
function exportData(){window.api.exportBackup().then(ok=>{if(ok)toast('تم تصدير النسخة الاحتياطية')})}
async function restoreData(){
 confirmBox('استعادة نسخة احتياطية','سيتم استبدال جميع البيانات الحالية بمحتوى الملف المختار.',async()=>{
  const data=await window.api.importBackup();
  if(data){db=data;render();toast('تمت الاستعادة بنجاح')}
 },'متابعة');
}
function resetData(){
 confirmBox('حذف كل البيانات','سيتم حذف جميع العمال والمشاريع واليوميات والدفعات نهائيًا. لا يمكن التراجع.',()=>{
  db={workers:[],projects:[],logs:[],payments:[]};window.api.resetAll();render();toast('تم حذف جميع البيانات');
 });
}

/* ---------- boot ---------- */
$('#nav').innerHTML=PAGES.map(p=>`<button data-page="${p.id}">${p.icon(21)}${LABELS[p.id]}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
(async()=>{
 db=await window.api.getAll();
 try{
  const legacy=localStorage.getItem(KEY);
  if(legacy && !db.workers.length && !db.projects.length && !db.logs.length && !db.payments.length){
   const d=JSON.parse(legacy);
   await window.api.importAll(d);
   db=await window.api.getAll();
   localStorage.removeItem(KEY);
  }
 }catch(e){}
 render();
})();
</script>
</body>
