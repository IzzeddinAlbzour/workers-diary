<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2344">
<title>يوميات العمال</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Tahoma",sans-serif;background:#f4f7fb;color:#172033}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:560px;margin:auto;min-height:100vh;background:#f4f7fb}
header{background:#0b2344;color:white;padding:18px 18px 22px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px}header p{margin:6px 0 0;opacity:.8;font-size:13px}
main{padding:16px 14px 90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 12px #13294b12;margin-bottom:12px}
.stat b{font-size:22px;display:block;margin-top:7px}.stat span{font-size:12px;color:#68758a}
.icon{font-size:23px}.blue{color:#1265dc}.green{color:#0b9b68}.orange{color:#ef711b}.purple{color:#7854d8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:13px 14px;border-radius:12px;font-weight:bold}
.primary{background:#1265dc;color:white}.secondary{background:#e9f1ff;color:#1265dc}.danger{background:#ffecec;color:#c53030}.success{background:#e8fbf2;color:#07865a}
.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dce3ee;border-radius:11px;background:white;outline:none}.field textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{flex:1;padding:11px;border:1px solid #dce3ee;border-radius:11px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}.item:last-child{border-bottom:0}.item h3{margin:0 0 4px;font-size:15px}.item small{color:#718096}.amount{font-weight:bold}.empty{text-align:center;color:#7b8798;padding:25px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:white;border-top:1px solid #e5e9f0;display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:white;color:#758198;padding:9px 2px 8px;font-size:11px}nav button.active{color:#1265dc;font-weight:bold}nav .ni{display:block;font-size:20px;margin-bottom:2px}
.hidden{display:none!important}.back{background:transparent;color:white;font-size:20px;margin-left:8px}.titleline{display:flex;align-items:center}
.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#e9f1ff;color:#1265dc;font-size:11px}
.total{font-size:26px;font-weight:bold;color:#1265dc}.muted{color:#718096;font-size:12px}
hr{border:0;border-top:1px solid #edf0f5;margin:12px 0}
@media print{
 nav,header,.toolbar,.actions,button{display:none!important}
 body,.app{background:#fff}
 .card{box-shadow:none;border:1px solid #e5e9f0}
 main{padding:0}
}
</style>
</head>
<body>
<div class="app">
<header id="header"><div class="titleline"><h1 id="title">يوميات العمال</h1></div><p id="subtitle">إدارة العمال والمشاريع والحسابات</p></header>
<main id="main"></main>
<nav id="nav">
<button data-page="home" class="active"><span class="ni">⌂</span>الرئيسية</button>
<button data-page="workers"><span class="ni">👷</span>العمال</button>
<button data-page="projects"><span class="ni">🏗️</span>المشاريع</button>
<button data-page="reports"><span class="ni">📊</span>التقارير</button>
<button data-page="accounts"><span class="ni">💰</span>الحسابات</button>
</nav>
</div>
<script>
const KEY='workersDiary_v1';
let db={workers:[],projects:[],logs:[],payments:[]};
let page='home';
const $=s=>document.querySelector(s);
const save=()=>{};
const money=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ₪';
const today=()=>new Date().toISOString().slice(0,10);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function workerName(id){return db.workers.find(x=>x.id==id)?.name||'غير محدد'}
function projectName(id){return db.projects.find(x=>x.id==id)?.name||'غير محدد'}
function stats(){
 const earned=db.logs.reduce((a,l)=>a+Number(l.wage||0),0);
 const paid=db.payments.reduce((a,p)=>a+Number(p.amount||0),0);
 return {workers:db.workers.length,projects:db.projects.length,days:db.logs.length,earned,paid,balance:earned-paid};
}
function render(){
 $('#title').textContent={home:'يوميات العمال',workers:'العمال',projects:'المشاريع',reports:'التقارير',accounts:'الحسابات'}[page];
 $('#subtitle').textContent=page==='home'?'إدارة العمال والمشاريع والحسابات':'';
 $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 ({home:home,workers:workers,projects:projects,reports:reports,accounts:accounts}[page])();
}
function home(){
 const s=stats();
 $('#main').innerHTML=`
 <div class="grid">
  <div class="card stat"><span class="icon blue">👷</span><b>${s.workers}</b><span>عدد العمال</span></div>
  <div class="card stat"><span class="icon green">📅</span><b>${db.logs.filter(x=>x.date===today()).length}</b><span>يوميات اليوم</span></div>
  <div class="card stat"><span class="icon orange">🏗️</span><b>${s.projects}</b><span>المشاريع</span></div>
  <div class="card stat"><span class="icon purple">💵</span><b>${money(s.balance)}</b><span>الرصيد المستحق</span></div>
 </div>
 <div class="card"><h3>إجراءات سريعة</h3><div class="actions">
 <button class="btn primary" onclick="newLog()">➕ تسجيل يومية</button>
 <button class="btn secondary" onclick="newWorker()">👷 إضافة عامل</button>
 <button class="btn secondary" onclick="newProject()">🏗️ إضافة مشروع</button>
 <button class="btn success" onclick="newPayment()">💵 تسجيل دفعة</button>
 </div></div>
 <div class="card"><h3>آخر اليوميات</h3>${recentLogs()}</div>`;
}
function recentLogs(){
 const arr=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
 if(!arr.length)return '<div class="empty">لا توجد يوميات بعد</div>';
 return arr.map(l=>`<div class="item"><div><h3>${esc(workerName(l.workerId))}</h3><small>${esc(projectName(l.projectId))} • ${esc(l.date)} • ${esc(l.hours||0)} ساعة</small></div><span class="amount">${money(l.wage)}</span></div>`).join('');
}
function workers(){
 $('#main').innerHTML=`<div class="toolbar"><input id="ws" placeholder="بحث عن عامل..." oninput="filterWorkers()"><button class="btn primary" onclick="newWorker()">＋</button></div><div id="workerList"></div>`;
 filterWorkers();
}
function filterWorkers(){
 const q=($('#ws')?.value||'').toLowerCase();
 const list=db.workers.filter(w=>w.name.toLowerCase().includes(q)||String(w.phone||'').includes(q));
 $('#workerList').innerHTML=list.length?list.map(w=>{
  const earned=db.logs.filter(l=>l.workerId===w.id).reduce((a,l)=>a+Number(l.wage||0),0);
  const paid=db.payments.filter(p=>p.workerId===w.id).reduce((a,p)=>a+Number(p.amount||0),0);
  return `<div class="card"><div class="item"><div><h3>👷 ${esc(w.name)}</h3><small>${esc(w.job||'عامل')} • ${esc(w.phone||'')}</small></div><button class="btn secondary" onclick="newLog('${w.id}')">＋ يومية</button></div><div class="row"><div><span class="muted">المستحق</span><br><b class="green">${money(earned)}</b></div><div><span class="muted">السلف/الدفعات</span><br><b class="orange">${money(paid)}</b></div></div><hr><b>الرصيد: ${money(earned-paid)}</b></div>`
 }).join(''):'<div class="empty">لا يوجد عمال</div>';
}
function projects(){
 $('#main').innerHTML=`<div class="toolbar"><div style="flex:1"></div><button class="btn primary" onclick="newProject()">＋ مشروع</button></div><div id="projectList"></div>`;
 $('#projectList').innerHTML=db.projects.length?db.projects.map(p=>{
  const logs=db.logs.filter(l=>l.projectId===p.id), total=logs.reduce((a,l)=>a+Number(l.wage||0),0);
  return `<div class="card"><h3>🏗️ ${esc(p.name)}</h3><small>${esc(p.location||'')} ${p.start?'• '+esc(p.start):''}</small><hr><div class="row"><div><span class="muted">اليوميات</span><br><b>${logs.length}</b></div><div><span class="muted">أجور مسجلة</span><br><b>${money(total)}</b></div></div></div>`;
 }).join(''):'<div class="empty">لا توجد مشاريع</div>';
}
function reports(){
 const s=stats();
 const byWorker=db.workers.map(w=>{const ls=db.logs.filter(l=>l.workerId===w.id);return {w,days:ls.length,hours:ls.reduce((a,l)=>a+Number(l.hours||0),0),earned:ls.reduce((a,l)=>a+Number(l.wage||0),0),paid:db.payments.filter(p=>p.workerId===w.id).reduce((a,p)=>a+Number(p.amount||0),0)}}).filter(x=>x.days||x.paid);
 $('#main').innerHTML=`<div class="card"><h3>ملخص التقرير</h3><div class="grid">
 <div><span class="muted">الأيام</span><br><b>${db.logs.length}</b></div><div><span class="muted">الساعات</span><br><b>${db.logs.reduce((a,l)=>a+Number(l.hours||0),0)}</b></div>
 <div><span class="muted">المستحقات</span><br><b class="green">${money(s.earned)}</b></div><div><span class="muted">المدفوع</span><br><b class="orange">${money(s.paid)}</b></div></div></div>
 <div class="card"><h3>كشف العمال</h3>${byWorker.length?byWorker.map(x=>`<div class="item"><div><b>${esc(x.w.name)}</b><br><small>${x.days} يوم • ${x.hours} ساعة</small></div><div style="text-align:left"><b class="green">${money(x.earned)}</b><br><small>صافي ${money(x.earned-x.paid)}</small></div></div>`).join(''):'<div class="empty">لا توجد بيانات</div>'}</div>
 <div class="actions"><button class="btn primary" onclick="window.print()">🖨️ طباعة</button><button class="btn secondary" onclick="exportData()">⬇️ تصدير البيانات</button></div>`;
}
function accounts(){
 const s=stats();
 $('#main').innerHTML=`<div class="grid"><div class="card stat"><span class="muted">إجمالي المستحقات</span><b class="green">${money(s.earned)}</b></div><div class="card stat"><span class="muted">إجمالي المدفوع</span><b class="orange">${money(s.paid)}</b></div></div>
 <div class="card"><h3>الرصيد الإجمالي</h3><div class="total">${money(s.balance)}</div><p class="muted">المستحقات المسجلة ناقص الدفعات والسلف.</p><button class="btn success" style="width:100%" onclick="newPayment()">➕ تسجيل دفعة / سلفة</button></div>
 <div class="card"><h3>آخر الدفعات</h3>${db.payments.slice(-10).reverse().map(p=>`<div class="item"><div><b>${esc(workerName(p.workerId))}</b><br><small>${esc(p.date)} • ${esc(p.note||'دفعة')}</small></div><b class="orange">${money(p.amount)}</b></div>`).join('')||'<div class="empty">لا توجد دفعات</div>'}</div>
 <div class="card"><h3>النسخ الاحتياطي</h3><div class="actions"><button class="btn secondary" onclick="exportData()">⬇️ تصدير</button><button class="btn secondary" onclick="restoreData()">⬆️ استعادة</button></div></div>
 <div class="card"><button class="btn danger" style="width:100%" onclick="resetData()">⚠️ حذف كل البيانات</button></div>`;
}
function modal(title,body,onSave){
 const wrap=document.createElement('div');wrap.id='modal';wrap.style.cssText='position:fixed;inset:0;background:#0008;z-index:30;padding:18px;overflow:auto';
 wrap.innerHTML=`<div style="max-width:520px;margin:25px auto;background:#f4f7fb;border-radius:18px;overflow:hidden"><div style="background:#0b2344;color:#fff;padding:17px;font-size:19px;font-weight:bold">${title}</div><div style="padding:15px">${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">حفظ</button><button class="btn secondary" onclick="document.getElementById('modal').remove()">إلغاء</button></div></div></div>`;
 document.body.appendChild(wrap);$('#saveBtn').onclick=()=>{if(onSave())wrap.remove()};
}
function newWorker(){
 modal('إضافة عامل',`<div class="field"><label>اسم العامل *</label><input id="n" required></div><div class="row"><div class="field"><label>رقم الهاتف</label><input id="p"></div><div class="field"><label>المهنة</label><input id="j" placeholder="سباك، كهربائي..."></div></div><div class="field"><label>الأجرة اليومية الافتراضية</label><input id="w" type="number" min="0"></div>`,()=>{
  if(!$('#n').value.trim()){alert('اكتب اسم العامل');return false}
  const w={id:crypto.randomUUID(),name:$('#n').value.trim(),phone:$('#p').value,job:$('#j').value,defaultWage:Number($('#w').value||0)};
  db.workers.push(w);window.api.addWorker(w);save();render();return true});
}
function newProject(){
 modal('إضافة مشروع',`<div class="field"><label>اسم المشروع *</label><input id="n"></div><div class="field"><label>الموقع</label><input id="l"></div><div class="field"><label>تاريخ البداية</label><input id="d" type="date" value="${today()}"></div>`,()=>{
 if(!$('#n').value.trim()){alert('اكتب اسم المشروع');return false}
 const p={id:crypto.randomUUID(),name:$('#n').value.trim(),location:$('#l').value,start:$('#d').value};
 db.projects.push(p);window.api.addProject(p);save();render();return true});
}
function newLog(workerId=''){
 const opts=db.workers.map(w=>`<option value="${w.id}" ${w.id===workerId?'selected':''}>${esc(w.name)}</option>`).join('');
 const propts=db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 modal('تسجيل يومية جديدة',`<div class="field"><label>العامل *</label><select id="wi"><option value="">اختر العامل</option>${opts}</select></div><div class="field"><label>المشروع</label><select id="pi"><option value="">اختر المشروع</option>${propts}</select></div><div class="row"><div class="field"><label>التاريخ</label><input id="dt" type="date" value="${today()}"></div><div class="field"><label>عدد الساعات</label><input id="hr" type="number" min="0" step=".5" value="8"></div></div><div class="row"><div class="field"><label>الأجرة اليومية *</label><input id="wg" type="number" min="0"></div><div class="field"><label>سلفة/دفعة اليوم</label><input id="pay" type="number" min="0" value="0"></div></div><div class="field"><label>نوع العمل</label><input id="type" placeholder="سباكة، كهرباء، جبصين..."></div><div class="field"><label>ملاحظات</label><textarea id="note"></textarea></div>`,()=>{
 const wid=$('#wi').value;if(!wid){alert('اختر العامل');return false}
 const worker=db.workers.find(w=>w.id===wid);const wage=Number($('#wg').value||worker.defaultWage||0);
 if(!wage){alert('اكتب الأجرة');return false}
 const l={id:crypto.randomUUID(),workerId:wid,projectId:$('#pi').value,date:$('#dt').value,hours:Number($('#hr').value||0),wage,type:$('#type').value,note:$('#note').value};
 db.logs.push(l);window.api.addLog(l);
 const pay=Number($('#pay').value||0);if(pay){const pm={id:crypto.randomUUID(),workerId:wid,date:$('#dt').value,amount:pay,note:'سلفة من اليومية'};db.payments.push(pm);window.api.addPayment(pm);}
 save();render();return true});
}
function newPayment(){
 const opts=db.workers.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
 modal('تسجيل دفعة / سلفة',`<div class="field"><label>العامل *</label><select id="wi"><option value="">اختر العامل</option>${opts}</select></div><div class="row"><div class="field"><label>المبلغ *</label><input id="am" type="number" min="0"></div><div class="field"><label>التاريخ</label><input id="dt" type="date" value="${today()}"></div></div><div class="field"><label>ملاحظات</label><input id="note" placeholder="سلفة، راتب، دفعة..."></div>`,()=>{
 if(!$('#wi').value||!Number($('#am').value)){alert('اختر العامل واكتب المبلغ');return false}
 const p={id:crypto.randomUUID(),workerId:$('#wi').value,amount:Number($('#am').value),date:$('#dt').value,note:$('#note').value};
 db.payments.push(p);window.api.addPayment(p);save();render();return true});
}
function exportData(){
 window.api.exportBackup();
}
async function restoreData(){
 if(!confirm('سيتم استبدال جميع البيانات الحالية بمحتوى الملف المختار. هل أنت متأكد؟'))return;
 const data=await window.api.importBackup();
 if(data){db=data;render()}
}
function resetData(){if(confirm('سيتم حذف جميع العمال والمشاريع واليوميات والدفعات. هل أنت متأكد؟')){db={workers:[],projects:[],logs:[],payments:[]};window.api.resetAll();save();render()}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
(async()=>{
 db=await window.api.getAll();
 try{
  const legacy=localStorage.getItem(KEY);
  if(legacy && !db.workers.length && !db.projects.length && !db.logs.length && !db.payments.length){
   const d=JSON.parse(legacy);
   await window.api.importAll(d);
   db=await window.api.getAll();
   localStorage.removeItem(KEY);
  }
 }catch(e){}
 render();
})();
</script>
</body>
</html>
