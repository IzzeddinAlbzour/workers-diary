<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2344">
<title>يوميات العمال</title>
<link rel="stylesheet" href="fonts/tajawal.css">
<style>
:root{
 --navy:#0b2344; --navy-2:#12305c; --blue:#1265dc; --blue-soft:#e9f1ff;
 --green:#0b9b68; --green-soft:#e8fbf2; --orange:#e0680f; --orange-soft:#fff1e6;
 --red:#c53030; --red-soft:#ffecec; --purple:#7854d8;
 --ink:#172033; --ink-2:#4a566b; --ink-3:#5d6b83;
 --bg:#f2f5fa; --line:#e6ebf3; --card:#ffffff;
 --r:16px; --shadow:0 2px 10px rgba(19,41,75,.07),0 1px 3px rgba(19,41,75,.05);
 --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:620px;margin:auto;min-height:100vh}

/* ---------- header ---------- */
header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 20px 24px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header p{margin:5px 0 0;color:#b9c6dd;font-size:13px;font-weight:500}
.headline{display:flex;align-items:center;gap:10px}
.headline .mark{width:34px;height:34px;flex:none;background:#f7b500;border-radius:10px;display:grid;place-items:center;color:var(--navy)}
#pagewrap{animation:pagein .28s var(--ease)}
@keyframes pagein{from{transform:translateY(7px)}to{transform:none}}

main{padding:16px 14px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}

/* ---------- stats ---------- */
.stat{display:flex;flex-direction:column;gap:8px}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.stat span.lbl{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:-6px}
.tint-blue{background:var(--blue-soft);color:var(--blue)}
.tint-green{background:var(--green-soft);color:var(--green)}
.tint-orange{background:var(--orange-soft);color:var(--orange)}
.tint-purple{background:#f0ebfc;color:var(--purple)}
.tint-red{background:var(--red-soft);color:var(--red)}

/* ---------- buttons ---------- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.primary{background:var(--blue);color:#fff}
.primary:hover{background:#0f57be}
.secondary{background:var(--blue-soft);color:var(--blue)}
.secondary:hover{background:#dce9ff}
.danger{background:var(--red-soft);color:var(--red)}
.success{background:var(--green-soft);color:#07865a}
.wide{width:100%}
.iconbtn{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue)}
.iconbtn.del:hover{background:var(--red-soft);color:var(--red)}

/* ---------- forms ---------- */
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid #d9e1ee;border-radius:11px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}
.field textarea{min-height:76px;resize:vertical}
.field.err input,.field.err select{border-color:var(--red);box-shadow:0 0 0 3px rgba(197,48,48,.11)}
.field .msg{display:none;color:var(--red);font-size:12.5px;font-weight:600;margin-top:5px}
.field.err .msg{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{padding:10px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none}
.search{flex:1;position:relative}
.search svg{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:11px 40px 11px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}

/* ---------- lists ---------- */
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0 0 3px;font-size:15px;font-weight:700}
.item small{color:var(--ink-3);font-size:12.5px}
.amount{font-weight:800}
.rowicons{display:flex;gap:2px;align-items:center}
.avatar{width:40px;height:40px;flex:none;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:16px}
.lead{display:flex;align-items:center;gap:11px;min-width:0}
.lead .tx{min-width:0}
.lead .tx h3,.lead .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.muted{color:var(--ink-3);font-size:12.5px;font-weight:500}
.total{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-.01em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- empty states ---------- */
.empty{text-align:center;color:var(--ink-3);padding:30px 16px}
.empty .eic{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:#9aa7bd}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:3px}
.empty p{margin:0 0 12px;font-size:13px}

/* ---------- nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav button{color:#77839a;padding:8px 2px 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s}
nav button svg{transition:transform .18s var(--ease)}
nav button.active{color:var(--blue);font-weight:800}
nav button.active svg{transform:translateY(-1px)}
nav button.active::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--blue)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,17,34,.55);z-index:30;padding:18px;overflow:auto;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{max-width:520px;margin:26px auto;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(8,17,34,.35);animation:sheetin .26s var(--ease)}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet .head{background:var(--navy);color:#fff;padding:16px 18px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sheet .head .x{color:#b9c6dd;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.sheet .head .x:hover{background:rgba(255,255,255,.12);color:#fff}
.sheet .body{padding:16px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:74px;left:0;right:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
#toast .t{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(8,17,34,.3);display:flex;gap:8px;align-items:center;animation:toastin .3s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);z-index:50;display:grid;place-items:center;padding:20px}
.authbox{width:100%;max-width:400px;background:var(--bg);border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:sheetin .3s var(--ease)}
.authbox .amark{width:52px;height:52px;background:#f7b500;border-radius:15px;display:grid;place-items:center;color:var(--navy);margin:0 auto 12px}
.authbox h2{margin:0 0 4px;text-align:center;font-size:20px;font-weight:800}
.authbox .sub{text-align:center;color:var(--ink-3);font-size:13px;margin:0 0 14px}
.userpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.userpick button{background:#fff;border:1.5px solid #d9e1ee;border-radius:12px;padding:10px 16px;font-weight:700;transition:all .12s}
.userpick button:hover{border-color:var(--blue);color:var(--blue)}
.userpick button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.permrow{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:14px;font-weight:600;color:var(--ink-2)}
.permrow input{width:17px;height:17px;accent-color:var(--blue)}
.userline .badge-admin{background:#f7b500;color:var(--navy);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800}
.logoutbtn{position:absolute;top:18px;left:18px;color:#b9c6dd;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;z-index:6}
.logoutbtn:hover{background:rgba(255,255,255,.12);color:#fff}
@media(min-width:900px){.logoutbtn{position:fixed;left:auto;right:190px;top:24px}}

/* ---------- photos ---------- */
.photobox{border:1.5px dashed #c9d4e5;border-radius:11px;min-height:96px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;position:relative}
.photobox img{width:100%;height:112px;object-fit:cover;cursor:pointer;display:block}
.photobox .addph{color:var(--ink-3);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px;width:100%}
.photobox .addph:hover{color:var(--blue)}
.photobox .rmph{position:absolute;top:6px;left:6px;background:rgba(11,35,68,.8);color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.chip{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px 0 2px 4px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- desktop (MacBook) layout: sidebar nav ---------- */
@media(min-width:900px){
 .app{max-width:none;padding-right:236px}
 header{position:fixed;top:0;right:0;width:236px;height:100vh;border-radius:0;padding:26px 20px}
 .headline{flex-direction:column;align-items:flex-start;gap:12px}
 nav{top:170px;bottom:auto;left:auto;right:0;width:236px;max-width:none;background:transparent;border:0;backdrop-filter:none;display:block;padding:0 12px}
 nav button{flex-direction:row;justify-content:flex-start;gap:11px;width:100%;padding:12px 14px;font-size:14.5px;border-radius:11px;color:#b9c6dd;margin-bottom:2px}
 nav button:hover{background:rgba(255,255,255,.08);color:#fff}
 nav button.active{background:rgba(255,255,255,.14);color:#fff}
 nav button.active::before{display:none}
 main{padding:26px 28px 40px;max-width:1080px;margin:0 auto}
 .grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
 .actions{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
 #workerList,#projectList{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 #workerList .card,#projectList .card{margin-bottom:0}
 .sheet{margin-top:60px}
 #toast{bottom:34px}
}

/* ---------- print ---------- */
#printSheet{display:none}
.ptable{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:14px}
.ptable th,.ptable td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.ptable th{background:var(--bg)}
.ptable tfoot td{font-weight:800}
@media print{
 nav,header,.toolbar,.actions,button,select,#toast{display:none!important}
 body,.app{background:#fff}
 .card{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
 main{padding:0}
 body.printing-sheet .app{display:none!important}
 body.printing-sheet #printSheet{display:block!important}
}
</style>
</head>
<body>
<div class="app">
<header>
 <button class="logoutbtn" id="logoutBtn" style="display:none" title="تسجيل الخروج" aria-label="تسجيل الخروج" onclick="logout()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h-8v16h8"/><path d="M10 12h11"/><path d="m17.5 8.5 3.5 3.5-3.5 3.5"/></svg></button>
 <div class="headline">
  <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v2h14v-2a7 7 0 0 0-7-7Z"/><path d="M3 15h18"/><path d="M12 3v4"/></svg></span>
  <div><h1 id="title">يوميات العمال</h1><p id="subtitle">إدارة العمال والمشاريع والحسابات</p></div>
 </div>
</header>
<main><div id="pagewrap"><div id="main"></div></div>
<p style="text-align:center;color:#9aa7bd;font-size:12px;font-weight:500;margin:4px 0 0">
 صنع بواسطة Ezz Al-Bzour © 2026<br>
 واتساب <span class="num" dir="ltr">+972 56 947 2423</span>
</p></main>
<nav id="nav"></nav>
</div>
<div id="toast"></div>
<div id="printSheet"></div>
<script>
/* ---------- icon system: one stroke family (24px grid, 2px, round) ---------- */
const I = (d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic = {
 home: d=>I('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',d),
 users: d=>I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6"/><path d="M18.5 15.4c1.6.8 2.7 2.4 3 4.6"/>',d),
 crane: d=>I('<path d="M4 21h9"/><path d="M8.5 21V8"/><path d="M4.5 8h4"/><path d="M8.5 8 19 5.5"/><path d="M19 5.5V12"/><path d="M17.5 12h3"/><path d="M19 12v3.2"/><circle cx="19" cy="16.7" r="1.5"/><path d="M8.5 12h-4v9"/>',d),
 chart: d=>I('<path d="M4 4v16h16"/><path d="M8.5 16v-5"/><path d="M13 16V7.5"/><path d="M17.5 16v-3"/>',d),
 wallet: d=>I('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><path d="M16 13.5h4"/>',d),
 plus: d=>I('<path d="M12 5v14"/><path d="M5 12h14"/>',d),
 pay: d=>I('<rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M6.5 6V4.5"/>',d),
 edit: d=>I('<path d="M4 20h4.5L20 8.5a2.1 2.1 0 0 0-3-3L5.5 17 4 20Z"/><path d="M14.5 8 16 9.5"/>',d),
 trash: d=>I('<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/>',d),
 search: d=>I('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/>',d),
 print: d=>I('<path d="M7 8V3h10v5"/><rect x="4" y="8" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',d),
 down: d=>I('<path d="M12 4v11"/><path d="m7 11 5 4.5L17 11"/><path d="M5 20h14"/>',d),
 up: d=>I('<path d="M12 20V9"/><path d="m7 13 5-4.5L17 13"/><path d="M5 4h14"/>',d),
 warn: d=>I('<path d="M12 3.5 22 20H2Z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/>',d),
 check: d=>I('<path d="m4.5 12.5 5 5L19.5 7"/>',d),
 x: d=>I('<path d="M6 6l12 12"/><path d="M18 6 6 18"/>',d),
 cal: d=>I('<rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 10h16"/><path d="M8 3v4"/><path d="M16 3v4"/>',d),
 gear: d=>I('<circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.7M12 18.5v2.7M2.8 12h2.7M18.5 12h2.7M5.5 5.5l1.9 1.9M16.6 16.6l1.9 1.9M18.5 5.5l-1.9 1.9M7.4 16.6l-1.9 1.9"/>',d),
 lock: d=>I('<rect x="5" y="10" width="14" height="10" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',d)
};

const PAGES=[
 {id:'home', title:'يوميات العمال', icon:ic.home, ok:()=>true},
 {id:'workers', title:'العمال', icon:ic.users, ok:()=>true},
 {id:'projects', title:'المشاريع', icon:ic.crane, ok:()=>true},
 {id:'reports', title:'التقارير', icon:ic.chart, ok:()=>can('money')},
 {id:'accounts', title:'الحسابات', icon:ic.wallet, ok:()=>can('money')},
 {id:'expenses', title:'المصاريف', icon:ic.pay, ok:()=>can('money')},
 {id:'settings', title:'الإعدادات', icon:ic.gear, ok:()=>CU&&CU.isAdmin}
];
const LABELS={home:'الرئيسية',workers:'العمال',projects:'المشاريع',reports:'التقارير',accounts:'الحسابات',expenses:'المصاريف',settings:'الإعدادات'};

const KEY='workersDiary_v1';
let db={workers:[],projects:[],logs:[],payments:[],projectPayments:[],expenses:[]};
let page='home';
let _wsort='def',_psort='def',_rsort='def',_showDone=false;
let _rWorker='',_rProject='',_rFrom='',_rTo='';
let _eFrom='',_eTo='';
let _openWorker=null; // workerId whose full-profile viewSheet is currently open, for live refresh after edits
let CU=null; // current user {id,name,isAdmin,perms}
const can=k=>!!CU&&(CU.isAdmin||!!CU.perms[k]);
const PERMS=[
 ['logs','تسجيل يوميات ودفعات'],
 ['editDelete','تعديل وحذف السجلات'],
 ['money','رؤية الحسابات والأرصدة'],
 ['private','بيانات العمال الخاصة (هوية/بنك/صور)'],
 ['projPay','دفعات المشاريع المقبوضة'],
 ['manage','إدارة العمال والمشاريع']
];
const $=s=>document.querySelector(s);
const money=n=>`<span class="num">${Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})} ₪</span>`;
const today=()=>new Date().toISOString().slice(0,10);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
/* accept Arabic-Indic digits (٠١٢٣ / ۰۱۲۳) and normalize to Latin so Number() works */
function digits(el){
 const v=el.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^0-9.]/g,'');
 if(v!==el.value)el.value=v;
}
function workerName(id){return db.workers.find(x=>x.id==id)?.name||'غير محدد'}
function projectName(id){return db.projects.find(x=>x.id==id)?.name||'غير محدد'}
function stats(){
 const earned=db.logs.reduce((a,l)=>a+Number(l.wage||0),0);
 const profit=db.logs.reduce((a,l)=>a+Number(l.profit||0),0);
 const billed=earned+profit;
 const paid=db.payments.reduce((a,p)=>a+Number(p.amount||0),0);
 return {workers:db.workers.length,projects:db.projects.length,days:db.logs.length,earned,profit,billed,paid,balance:earned-paid};
}
function toast(msg){
 $('#toast').innerHTML=`<div class="t">${ic.check(16)} ${esc(msg)}</div>`;
 clearTimeout(toast._t); toast._t=setTimeout(()=>{$('#toast').innerHTML=''},2200);
}
function undoToast(msg,restoreFn){
 $('#toast').innerHTML=`<div class="t">${ic.check(16)} ${esc(msg)} <button style="pointer-events:auto;font-weight:800;text-decoration:underline;padding:0 2px" id="undoBtn">تراجع</button></div>`;
 clearTimeout(toast._t); toast._t=setTimeout(()=>{$('#toast').innerHTML=''},6000);
 $('#undoBtn').onclick=()=>{clearTimeout(toast._t);$('#toast').innerHTML='';restoreFn();};
}
function emptyState(icon,title,hint,btn){
 return `<div class="empty"><div class="eic">${icon(26)}</div><b>${title}</b><p>${hint}</p>${btn||''}</div>`;
}
function printSheet(title,html){
 $('#printSheet').innerHTML=`<h2>${esc(title)}</h2>${html}`;
 document.body.classList.add('printing-sheet');
 const done=()=>{document.body.classList.remove('printing-sheet');window.removeEventListener('afterprint',done)};
 window.addEventListener('afterprint',done);
 window.print();
 setTimeout(done,4000);
}
function buildNav(){
 $('#nav').innerHTML=PAGES.filter(p=>p.ok()).map(p=>`<button data-page="${p.id}">${p.icon(21)}${LABELS[p.id]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
}
function render(){
 const pg=PAGES.find(p=>p.id===page);
 if(!pg||!pg.ok()){page='home';return render()}
 $('#title').textContent=pg.title;
 $('#subtitle').textContent=CU?`المستخدم: ${CU.name}`:'إدارة العمال والمشاريع والحسابات';
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 ({home,workers,projects,reports,accounts,expenses,settings})[page]();
 const w=$('#pagewrap'); w.style.animation='none'; void w.offsetWidth; w.style.animation='';
}

 <div class="rowicons"><span class="amount">${money(l.wage)}</span>${withActions&&can('editDelete')?`
  <button class="iconbtn" title="تعديل" onclick="editLog('${l.id}')">${ic.edit(16)}</button>

function recentLogs(){
 const arr=[...db.logs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);

 return arr.map(l=>logRow(l,true)).join('');

/* ---------- expenses (partner settlement) ---------- */
const PARTNERS=[['me','مصاريفي'],['brother','مصاريف أخي']];
const partnerLabel=k=>PARTNERS.find(x=>x[0]===k)?.[1]||k;
function filteredExpenses(){
 return db.expenses.filter(x=>(!_eFrom||x.date>=_eFrom)&&(!_eTo||x.date<=_eTo));
}
function expenses(){
 const list=[...filteredExpenses()].sort((a,b)=>b.date.localeCompare(a.date));
 const meTotal=list.filter(x=>x.partner==='me').reduce((a,x)=>a+Number(x.amount||0),0);
 const brTotal=list.filter(x=>x.partner==='brother').reduce((a,x)=>a+Number(x.amount||0),0);
 const diff=meTotal-brTotal;
 let settleLine;
 if(!meTotal&&!brTotal)settleLine='لا توجد مصاريف في هذه الفترة بعد.';
 else if(diff===0)settleLine='المصاريف متعادلة، لا يوجد تحويل مطلوب.';
 else if(diff>0)settleLine=`على أخيك تحويل ${money(diff/2)} لك لتعادل المصاريف قبل توزيع الأرباح.`;
 else settleLine=`عليك تحويل ${money(Math.abs(diff)/2)} لأخيك لتعادل المصاريف قبل توزيع الأرباح.`;

/* ---------- modal + validation ---------- */
function modal(title,body,onSave,saveLabel='حفظ'){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()" title="إغلاق" aria-label="إغلاق">${ic.x(17)}</button></div><div class="body">${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">${saveLabel}</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#saveBtn').onclick=()=>{if(onSave())closeModal()};
 const f=wrap.querySelector('input,select,textarea'); if(f)f.focus();
}
function closeModal(){$('#modal')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeView()}});
function fieldErr(id,msg){
 const el=$('#'+id); const f=el.closest('.field'); f.classList.add('err');
 f.querySelector('.msg').textContent=msg;
 el.addEventListener('input',()=>f.classList.remove('err'),{once:true});
 el.focus(); return false;
}
const F=(id,label,inner)=>`<div class="field"><label for="${id}">${label}</label>${inner}<div class="msg"></div></div>`;

function confirmBox(title,body,onYes,yesLabel='حذف'){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()" title="إغلاق" aria-label="إغلاق">${ic.x(17)}</button></div><div class="body"><div style="display:flex;gap:12px;align-items:flex-start"><span class="tint-red" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none">${ic.warn(19)}</span><p style="margin:6px 0 14px">${body}</p></div><div class="actions"><button class="btn danger" id="yesBtn">${yesLabel}</button><button class="btn secondary" onclick="closeModal()">إلغاء</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#yesBtn').onclick=()=>{onYes();closeModal()};
}

function workerDetail(workerId,projectId=''){
 _openWorker=projectId?null:workerId;

 if(!w){toast('العامل غير موجود');return}

 }else{

   <div style="display:flex;gap:10px;align-items:flex-start"><span class="tint-red" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none">${ic.warn(17)}</span>
   <div style="flex:1;min-width:0"><b style="color:var(--red)"><span class="num">${orphanLogs.length}</span> يومية بدون مشروع محدد</b>
   <p class="muted" style="margin:4px 0 10px">يوميات قديمة سُجّلت قبل إلزام اختيار المشروع${can('money')?` بقيمة ${money(orphanWage)}`:''}. اضغط ${ic.edit(13)} لكل يومية لاختيار مشروع لها، أو احذفها.</p>
   ${orphanRows}
   <button class="btn danger" style="margin-top:10px" onclick="deleteOrphanLogs('${workerId}')">${ic.trash(16)} حذف كل اليوميات بدون مشروع</button></div></div></div>`:'';
  const byP={};logs.forEach(l=>{const k=l.projectId||'';byP[k]=byP[k]||{days:0,wage:0};byP[k].days++;byP[k].wage+=Number(l.wage||0)});
  const projRows=Object.entries(byP).map(([pid,v])=>`<div class="item"><div class="tx"><b>${esc(pid?projectName(pid):'بدون مشروع')}</b></div><div style="text-align:left"><span class="num">${v.days}</span> يوم${can('money')?` • ${money(v.wage)}`:''}</div></div>`).join('')||emptyState(ic.crane,'لا مشاريع','لم يعمل هذا العامل على أي مشروع بعد');
  const allLogsHtml=[...logs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>logRow(l,true)).join('')||emptyState(ic.cal,'لا توجد يوميات','لا توجد يوميات لهذا العامل بعد');
  const pays=db.payments.filter(p=>p.workerId===workerId).slice(-5).reverse();
  const paysHtml=pays.map(p=>`<div class="item"><div class="tx"><small><span class="num">${esc(p.date)}</span> • ${esc(p.note||'دفعة')}</small></div><div class="rowicons"><b style="color:var(--orange)">${money(p.amount)}</b>${can('editDelete')?`

  body=head

function companyReportHtml(projectId){
 const p=db.projects.find(x=>x.id===projectId);
 const logs=[...db.logs.filter(l=>l.projectId===projectId)].sort((a,b)=>a.date.localeCompare(b.date));
 const pays=[...db.projectPayments.filter(x=>x.projectId===projectId)].sort((a,b)=>a.date.localeCompare(b.date));
 const totalBilled=logs.reduce((a,l)=>a+Number(l.wage||0)+Number(l.profit||0),0);
 const totalReceived=pays.reduce((a,x)=>a+Number(x.amount||0),0);
 const logsRows=logs.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(workerName(l.workerId))}</td><td>${esc(l.hours||0)}</td><td>${esc(l.type||'')}</td><td>${money(Number(l.wage||0)+Number(l.profit||0))}</td></tr>`).join('')||`<tr><td colspan="5">لا يوجد سجلات</td></tr>`;
 const paysRows=pays.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note||'')}</td><td>${money(x.amount)}</td></tr>`).join('')||`<tr><td colspan="3">لا يوجد دفعات</td></tr>`;
 return `<p class="muted">${esc(p?.location||'')}${p?.start?' • '+esc(p.start):''}</p>
 <h4>سجلات العمل</h4><table class="ptable"><thead><tr><th>التاريخ</th><th>العامل</th><th>الساعات</th><th>نوع العمل</th><th>المبلغ</th></tr></thead><tbody>${logsRows}</tbody><tfoot><tr><td colspan="4">الإجمالي</td><td>${money(totalBilled)}</td></tr></tfoot></table>
 <h4>الدفعات المقبوضة</h4><table class="ptable"><thead><tr><th>التاريخ</th><th>ملاحظات</th><th>المبلغ</th></tr></thead><tbody>${paysRows}</tbody><tfoot><tr><td colspan="2">الإجمالي</td><td>${money(totalReceived)}</td></tr></tfoot></table>`;
}

/* internal worker print: all logs, grouped by project, wage/profit shown only if the printing user can('money') */
function printWorkerFull(workerId){
 const w=db.workers.find(x=>x.id===workerId);
 if(!w)return;
 const logs=[...db.logs.filter(l=>l.workerId===workerId)].sort((a,b)=>a.date.localeCompare(b.date));
 const showMoney=can('money');
 const byProj={};
 logs.forEach(l=>{const k=l.projectId||'';(byProj[k]=byProj[k]||[]).push(l)});
 const sections=Object.entries(byProj).map(([pid,ls])=>{
  const rows=ls.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.hours||0)}</td><td>${esc(l.type||'')}</td>${showMoney?`<td>${money(l.wage)}</td><td>${money(l.profit||0)}</td><td>${money(Number(l.wage||0)+Number(l.profit||0))}</td>`:''}</tr>`).join('');
  const subtotal=ls.reduce((a,l)=>a+Number(l.wage||0),0);
  return `<h4>${esc(pid?projectName(pid):'بدون مشروع')}</h4><table class="ptable"><thead><tr><th>التاريخ</th><th>الساعات</th><th>نوع العمل</th>${showMoney?'<th>أجر العامل</th><th>ربحك</th><th>المستحق من الشركة</th>':''}</tr></thead><tbody>${rows}</tbody>${showMoney?`<tfoot><tr><td colspan="3">إجمالي أجر العامل في هذا المشروع</td><td colspan="3">${money(subtotal)}</td></tr></tfoot>`:''}</table>`;
 }).join('')||'<p>لا توجد يوميات</p>';
 let summary='';
 if(showMoney){
  const totalEarned=logs.reduce((a,l)=>a+Number(l.wage||0),0);
  const totalPaid=db.payments.filter(p=>p.workerId===workerId).reduce((a,p)=>a+Number(p.amount||0),0);
  summary=`<p><b>إجمالي المستحق:</b> ${money(totalEarned)} &nbsp; <b>المدفوع:</b> ${money(totalPaid)} &nbsp; <b>الرصيد:</b> ${money(totalEarned-totalPaid)}</p>`;
 }
 printSheet(w.name,`<p class="muted">${esc(w.job||'')}${w.phone?' • '+esc(w.phone):''}</p>${summary}${sections}`);
}

function logForm(l={},preWorker=''){
 const wid=l.workerId||preWorker;
 const opts=db.workers.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('');
 const propts=db.projects.map(p=>`<option value="${p.id}" ${p.id===l.projectId?'selected':''}>${esc(p.name)}</option>`).join('');
 const startWorker=db.workers.find(w=>w.id===wid);
 const wageVal=l.wage??(startWorker?startWorker.defaultWage:'')??'';
 const profitVal=l.profit??(startWorker?startWorker.defaultProfit:0)??0;
 const billedVal=(Number(wageVal||0)+Number(profitVal||0))||'';
 return F('wi','العامل *',`<select id="wi" onchange="fillDefaultWage()"><option value="">اختر العامل</option>${opts}</select>`)
 +F('pi','المشروع *',`<select id="pi"><option value="">اختر المشروع</option>${propts}</select>`)
 +`<div class="row">${F('dt','التاريخ',`<input id="dt" type="date" value="${esc(l.date||today())}">`)}${F('hr','عدد الساعات',`<input id="hr" type="text" inputmode="decimal" oninput="digits(this)" value="${l.hours??8}">`)}</div>`
 +`<div class="row">${F('wg','أجرة العامل *',`<input id="wg" type="text" inputmode="decimal" oninput="digits(this);syncWage('wg')" value="${wageVal}">`)}${F('pf','ربحك اليومي',`<input id="pf" type="text" inputmode="decimal" oninput="digits(this);syncWage('pf')" value="${profitVal}">`)}</div>`
 +F('bl','المستحق من الشركة',`<input id="bl" type="text" inputmode="decimal" oninput="digits(this);syncWage('bl')" value="${billedVal}">`)

 +F('note','ملاحظات',`<textarea id="note">${esc(l.note||'')}</textarea>`);
}
function syncWage(src){
 const wg=Number($('#wg').value||0),pf=Number($('#pf').value||0),bl=Number($('#bl').value||0);
 if(src==='bl')$('#pf').value=Math.round((bl-wg)*100)/100;
 else $('#bl').value=Math.round((wg+pf)*100)/100;
}
function fillDefaultWage(){
 const w=db.workers.find(x=>x.id===$('#wi').value);
 if(w){$('#wg').value=w.defaultWage||0;$('#pf').value=w.defaultProfit||0;syncWage('wg');}
}

function exportData(){window.api.exportBackup().then(ok=>{if(ok)toast('تم تصدير النسخة الاحتياطية')})}
async function restoreData(){
 confirmBox('استعادة نسخة احتياطية','سيتم استبدال جميع البيانات الحالية بمحتوى الملف المختار.',async()=>{
  const data=await window.api.importBackup();
  if(data){db=data;render();toast('تمت الاستعادة بنجاح')}
 },'متابعة');
}
function resetData(){
 modal('حذف كل البيانات',
  `<div style="display:flex;gap:12px;align-items:flex-start"><span class="tint-red" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none">${ic.warn(19)}</span><p style="margin:6px 0 14px">سيتم حذف جميع العمال والمشاريع واليوميات والدفعات نهائيًا. لا يمكن التراجع.</p></div>`
  +F('rc','اكتب "حذف" للتأكيد',`<input id="rc">`),
  ()=>{
   if($('#rc').value.trim()!=='حذف')return fieldErr('rc','اكتب "حذف" بالضبط للتأكيد');
   db={workers:[],projects:[],logs:[],payments:[],projectPayments:[],expenses:[]};window.api.resetAll();render();toast('تم حذف جميع البيانات');
   return true;
  },'حذف نهائي');
}

/* ---------- activation (device-locked license) ---------- */
function activationScreen(machineId){
 const wrap=document.createElement('div');wrap.id='auth';
 wrap.innerHTML=`<div class="authbox"><div class="amark">${ic.lock(24)}</div><h2>تفعيل البرنامج</h2><p class="sub">هذا الترخيص مرتبط بجهاز واحد فقط. أرسل رمز الجهاز التالي للمطور للحصول على مفتاح التفعيل.</p>
  <div class="field"><label>رمز الجهاز</label><div style="display:flex;gap:8px"><input id="mid" readonly value="${esc(machineId)}" style="flex:1"><button class="btn secondary" id="copyMid" type="button">نسخ</button></div></div>
  ${F('lk','مفتاح التفعيل',`<input id="lk" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="text-align:center;letter-spacing:1px">`)}
  <button class="btn primary wide" id="actGo">تفعيل</button>
  <p class="muted" style="text-align:center;margin-top:12px">واتساب المطور: <span class="num" dir="ltr">+972 56 947 2423</span></p></div>`;
 document.body.appendChild(wrap);
 $('#copyMid').onclick=()=>{navigator.clipboard.writeText(machineId);toast('تم نسخ رمز الجهاز');};
 const go=async()=>{
  const key=$('#lk').value.trim();
  if(!key)return fieldErr('lk','اكتب مفتاح التفعيل');
  const ok=await window.api.activateLicense(key);
  if(!ok)return fieldErr('lk','مفتاح غير صحيح لهذا الجهاز');
  wrap.remove();boot();
 };
 $('#actGo').onclick=go;
 wrap.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 const f=wrap.querySelector('input');if(f)f.focus();
}

/* ---------- boot ---------- */
async function boot(){
 const lic=await window.api.licenseState();
 if(!lic.licensed){activationScreen(lic.machineId);return;}
 db=await window.api.getAll();
 try{
  const legacy=localStorage.getItem(KEY);
  if(legacy && !db.workers.length && !db.projects.length && !db.logs.length && !db.payments.length){
   const d=JSON.parse(legacy);
   await window.api.importAll(d);
   db=await window.api.getAll();
   localStorage.removeItem(KEY);
  }
 }catch(e){}
 authScreen(await window.api.authState());
}
boot();
</script>
</body>
</html>
