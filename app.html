<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2344">
<title>يوميات العمال</title>
<link rel="stylesheet" href="fonts/tajawal.css">
<style>
:root{
 --navy:#0b2344; --navy-2:#12305c; --blue:#1265dc; --blue-soft:#e9f1ff;
 --green:#0b9b68; --green-soft:#e8fbf2; --orange:#e0680f; --orange-soft:#fff1e6;
 --red:#c53030; --red-soft:#ffecec; --purple:#7854d8;
 --ink:#172033; --ink-2:#4a566b; --ink-3:#5d6b83;
 --bg:#f2f5fa; --line:#e6ebf3; --card:#ffffff;
 --r:16px; --shadow:0 2px 10px rgba(19,41,75,.07),0 1px 3px rgba(19,41,75,.05);
 --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Tajawal',Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums}
.app{max-width:620px;margin:auto;min-height:100vh}

/* ---------- header ---------- */
header{background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:20px 20px 24px;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header p{margin:5px 0 0;color:#b9c6dd;font-size:13px;font-weight:500}
.headline{display:flex;align-items:center;gap:10px}
.headline .mark{width:34px;height:34px;flex:none;background:#f7b500;border-radius:10px;display:grid;place-items:center;color:var(--navy)}
#pagewrap{animation:pagein .28s var(--ease)}
@keyframes pagein{from{transform:translateY(7px)}to{transform:none}}

main{padding:16px 14px 96px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:16px;font-weight:800}

/* ---------- stats ---------- */
.stat{display:flex;flex-direction:column;gap:8px}
.stat .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.stat b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.stat span.lbl{font-size:12.5px;color:var(--ink-3);font-weight:500;margin-top:-6px}
.tint-blue{background:var(--blue-soft);color:var(--blue)}
.tint-green{background:var(--green-soft);color:var(--green)}
.tint-orange{background:var(--orange-soft);color:var(--orange)}
.tint-purple{background:#f0ebfc;color:var(--purple)}
.tint-red{background:var(--red-soft);color:var(--red)}

/* ---------- buttons ---------- */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px;transition:transform .12s var(--ease),box-shadow .12s var(--ease),background .12s}
.btn:active{transform:scale(.97)}
.btn svg{flex:none}
.primary{background:var(--blue);color:#fff}
.primary:hover{background:#0f57be}
.secondary{background:var(--blue-soft);color:var(--blue)}
.secondary:hover{background:#dce9ff}
.danger{background:var(--red-soft);color:var(--red)}
.success{background:var(--green-soft);color:#07865a}
.wide{width:100%}
.iconbtn{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);transition:background .12s,color .12s}
.iconbtn:hover{background:var(--blue-soft);color:var(--blue)}
.iconbtn.del:hover{background:var(--red-soft);color:var(--red)}

/* ---------- forms ---------- */
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1.5px solid #d9e1ee;border-radius:11px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}
.field textarea{min-height:76px;resize:vertical}
.field.err input,.field.err select,.field.err textarea{border-color:var(--red);box-shadow:0 0 0 3px rgba(197,48,48,.11)}
.field .msg{display:none;color:var(--red);font-size:12.5px;font-weight:600;margin-top:5px}
.field.err .msg{display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{padding:10px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none}
.search{flex:1;position:relative}
.search svg{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:11px 40px 11px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none;transition:border-color .12s,box-shadow .12s}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}

/* ---------- lists ---------- */
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item h3{margin:0 0 3px;font-size:15px;font-weight:700}
.item small{color:var(--ink-3);font-size:12.5px}
.amount{font-weight:800}
.rowicons{display:flex;gap:2px;align-items:center}
.avatar{width:40px;height:40px;flex:none;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:16px}
.lead{display:flex;align-items:center;gap:11px;min-width:0}
.lead .tx{min-width:0}
.lead .tx h3,.lead .tx small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.muted{color:var(--ink-3);font-size:12.5px;font-weight:500}
.total{font-size:28px;font-weight:800;color:var(--blue);letter-spacing:-.01em}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}

/* ---------- empty states ---------- */
.empty{text-align:center;color:var(--ink-3);padding:30px 16px}
.empty .eic{width:52px;height:52px;margin:0 auto 10px;border-radius:16px;background:var(--bg);display:grid;place-items:center;color:#9aa7bd}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:3px}
.empty p{margin:0 0 12px;font-size:13px}

/* ---------- nav ---------- */
/* flex + no-shrink instead of a fixed 5-column grid: an admin sees 8 tabs (home/workers/projects/
   reports/archive/accounts/expenses/settings), which used to wrap onto a second row and get
   silently covered by page content — now it scrolls horizontally in one row instead */
nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 20%;min-width:64px;color:#77839a;padding:8px 2px 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;transition:color .15s}
nav button svg{transition:transform .18s var(--ease)}
nav button.active{color:var(--blue);font-weight:800}
nav button.active svg{transform:translateY(-1px)}
nav button.active::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 4px 4px;background:var(--blue)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,17,34,.55);z-index:30;padding:18px;overflow:auto;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{max-width:520px;margin:26px auto;background:var(--bg);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(8,17,34,.35);animation:sheetin .26s var(--ease)}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sheet .head{background:var(--navy);color:#fff;padding:16px 18px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sheet .head .x{color:#b9c6dd;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.sheet .head .x:hover{background:rgba(255,255,255,.12);color:#fff}
.sheet .body{padding:16px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:74px;left:0;right:0;display:flex;justify-content:center;z-index:40;pointer-events:none}
#toast .t{background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:11px 18px;border-radius:12px;box-shadow:0 8px 24px rgba(8,17,34,.3);display:flex;gap:8px;align-items:center;animation:toastin .3s var(--ease)}
@keyframes toastin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- auth ---------- */
#auth,#activation{position:fixed;inset:0;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 100%);z-index:50;display:grid;place-items:center;padding:20px}
.authbox{width:100%;max-width:400px;background:var(--bg);border-radius:20px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:sheetin .3s var(--ease)}
.authbox .amark{width:52px;height:52px;background:#f7b500;border-radius:15px;display:grid;place-items:center;color:var(--navy);margin:0 auto 12px}
.authbox h2{margin:0 0 4px;text-align:center;font-size:20px;font-weight:800}
.authbox .sub{text-align:center;color:var(--ink-3);font-size:13px;margin:0 0 14px}
.userpick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:6px}
.userpick button{background:#fff;border:1.5px solid #d9e1ee;border-radius:12px;padding:10px 16px;font-weight:700;transition:all .12s}
.userpick button:hover{border-color:var(--blue);color:var(--blue)}
.userpick button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.permrow{display:flex;align-items:center;gap:9px;padding:8px 2px;font-size:14px;font-weight:600;color:var(--ink-2)}
.permrow input{width:17px;height:17px;accent-color:var(--blue)}
.userline .badge-admin{background:#f7b500;color:var(--navy);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:800}
.logoutbtn{position:absolute;top:18px;left:18px;color:#b9c6dd;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;z-index:6}
.logoutbtn:hover{background:rgba(255,255,255,.12);color:#fff}
@media(min-width:900px){.logoutbtn{position:fixed;left:auto;right:190px;top:24px}}

/* ---------- photos ---------- */
.photobox{border:1.5px dashed #c9d4e5;border-radius:11px;min-height:96px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;position:relative}
.photobox img{width:100%;height:112px;object-fit:cover;cursor:pointer;display:block}
.photobox .addph{color:var(--ink-3);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px;width:100%}
.photobox .addph:hover{color:var(--blue)}
.photobox .rmph{position:absolute;top:6px;left:6px;background:rgba(11,35,68,.8);color:#fff;width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.chip{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;margin:2px 0 2px 4px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- desktop (MacBook) layout: sidebar nav ---------- */
@media(min-width:900px){
 .app{max-width:none;padding-right:236px}
 header{position:fixed;top:0;right:0;width:236px;height:100vh;border-radius:0;padding:26px 20px}
 .headline{flex-direction:column;align-items:flex-start;gap:12px}
 nav{top:170px;bottom:auto;left:auto;right:0;width:236px;max-width:none;background:transparent;border:0;backdrop-filter:none;display:block;padding:0 12px}
 nav button{flex-direction:row;justify-content:flex-start;gap:11px;width:100%;padding:12px 14px;font-size:14.5px;border-radius:11px;color:#b9c6dd;margin-bottom:2px}
 nav button:hover{background:rgba(255,255,255,.08);color:#fff}
 nav button.active{background:rgba(255,255,255,.14);color:#fff}
 nav button.active::before{display:none}
 main{padding:26px 28px 40px;max-width:1080px;margin:0 auto}
 .grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
 .actions{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
 #workerList,#projectList{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
 #workerList .card,#projectList .card{margin-bottom:0}
 .sheet{margin-top:60px}
 #toast{bottom:34px}
}

/* ---------- print ---------- */
#printSheet{display:none}
.ptable{width:100%;border-collapse:collapse;margin:10px 0 18px;font-size:14px}
.ptable th,.ptable td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.ptable th{background:var(--bg)}
.ptable tfoot td{font-weight:800}
/* month bands inside a table: header row opens a month, subtotal row closes it */
.ptable tr.mhead td{background:var(--navy);color:#fff;font-weight:800;font-size:13.5px;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.ptable tr.msub td{background:var(--bg);font-weight:800;print-color-adjust:exact;-webkit-print-color-adjust:exact}

/* ---------- month sections (screen) ---------- */
.msec{margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.msec>summary{list-style:none;cursor:pointer;padding:11px 13px;background:var(--blue-soft);color:var(--navy);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.msec>summary::-webkit-details-marker{display:none}
.msec>summary .msum{font-weight:700;font-size:12.5px;color:var(--ink-2)}
.msec[open]>summary{border-bottom:1px solid var(--line)}
.msec>.mbody{padding:0 13px 8px}
.msec>.mbody .item:last-child{border-bottom:0}
.monthbar{display:flex;gap:6px;align-items:center}
.monthbar input[type=month]{flex:1;min-width:0;padding:11px 12px;border:1.5px solid #d9e1ee;border-radius:12px;background:#fff;outline:none}
.monthbar input[type=month]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,101,220,.13)}
.monthbar .step{width:40px;height:44px;flex:none;border-radius:11px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.monthbar .step:hover{background:#dce9ff}
.monthbar .step:disabled{opacity:.4;cursor:default;background:var(--bg)}

/* ---------- printed month statement ---------- */
.month-title{background:var(--navy);color:#fff;padding:7px 11px;border-radius:6px;font-size:15px;font-weight:800;margin:0 0 8px;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.month-sum{width:100%;border-collapse:collapse;margin:0 0 14px;font-size:13.5px}
.month-sum td{border:1px solid var(--line);padding:6px 8px}
.month-sum td:first-child{background:var(--bg);font-weight:700;width:58%;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.month-sum tr.final td{font-weight:800;font-size:15px}

/* ---------- printed document letterhead + sign-off (shared by preview and paper output) ---------- */
.doc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:12px;margin-bottom:16px;border-bottom:2px solid var(--navy)}
.doc-brand{display:flex;align-items:center;gap:10px}
.doc-mark{width:36px;height:36px;flex:none;border-radius:9px;background:var(--navy);color:#f7b500;display:grid;place-items:center;print-color-adjust:exact;-webkit-print-color-adjust:exact}
.doc-brand b{display:block;font-size:15px;font-weight:800;color:var(--navy)}
.doc-brand span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.doc-meta b{display:block;font-size:16px;font-weight:800}
.doc-meta span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sigblock{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.sigline{border-top:1px solid var(--ink);padding-top:6px;font-size:12px;color:var(--ink-2);font-weight:600;text-align:center}

/* ---------- print preview: document-viewer chrome, scoped to #printpreview so other modals are untouched ---------- */
#printpreview{background:rgba(15,22,36,.78)}
#printpreview .sheet{max-width:820px;background:transparent;box-shadow:none;border-radius:0;overflow:visible}
#printpreview .head{background:transparent;color:#e7ecf5;padding:0 2px 12px;font-size:13.5px;font-weight:700}
#printpreview .head .x{color:#c7d0e0}
#printpreview .head .x:hover{background:rgba(255,255,255,.14);color:#fff}
.pp-paper{background:#fff;color:var(--ink);border-radius:2px;padding:16mm 14mm;box-shadow:0 1px 2px rgba(8,17,34,.1),0 30px 60px -12px rgba(8,17,34,.5);min-height:40vh}
#printpreview .actions{margin-top:16px!important;max-width:340px;margin-inline:auto}

@page{margin:14mm 12mm}
@media print{
 html,body{height:auto!important;overflow:visible!important;background:#fff}
 /* the in-app preview modal is position:fixed, which Chromium clips to one page instead of
    paginating — it's always closed before printSheet() runs, but hide it defensively too so a
    stray open overlay never gets captured instead of #printSheet and truncate the output */
 .overlay,#printpreview{display:none!important}
 nav,header,.toolbar,.actions,button,select,#toast{display:none!important}
 body,.app{background:#fff}
 .card{box-shadow:none;border:1px solid var(--line);break-inside:avoid}
 main{padding:0}
 body.printing-sheet .app{display:none!important}
 body.printing-sheet #printSheet{display:block!important;position:static!important;color:#000}
 .doc-head{break-after:avoid}
 .sigblock{break-inside:avoid}
 /* one month per sheet: each month of a worker statement is its own signable payslip */
 .month-block+.month-block{break-before:page;page-break-before:always}
 .month-title{break-after:avoid;page-break-after:avoid}
 .month-sum{break-inside:avoid;page-break-inside:avoid}
 .ptable{font-size:12.5px}
 .ptable th{print-color-adjust:exact;-webkit-print-color-adjust:exact}
 .ptable thead{display:table-header-group}
 .ptable tfoot{display:table-row-group}
 .ptable tr{break-inside:avoid;page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
<header>
 <button class="logoutbtn" id="logoutBtn" style="display:none" title="تسجيل الخروج" aria-label="تسجيل الخروج" onclick="logout()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h-8v16h8"/><path d="M10 12h11"/><path d="m17.5 8.5 3.5 3.5-3.5 3.5"/></svg></button>
 <div class="headline">
  <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v2h14v-2a7 7 0 0 0-7-7Z"/><path d="M3 15h18"/><path d="M12 3v4"/></svg></span>
  <div><h1 id="title">يوميات العمال</h1><p id="subtitle">إدارة العمال والمشاريع والحسابات</p></div>
 </div>
</header>
<main><div id="pagewrap"><div id="main"></div></div>
<p style="text-align:center;color:#9aa7bd;font-size:12px;font-weight:500;margin:4px 0 0">
 <span id="madeBy">صنع بواسطة Ezz Al-Bzour © 2026</span><br>
 <span id="whatsappLbl">واتساب</span> <span class="num" dir="ltr">+972 56 947 2423</span>
</p></main>
<nav id="nav"></nav>
</div>
<div id="toast"></div>
<div id="printSheet"></div>
<script src="month.js"></script>
<script src="i18n.js"></script>
<script>
/* ---------- icon system: one stroke family (24px grid, 2px, round) ---------- */
const I = (d,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic = {
 home: d=>I('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',d),
 users: d=>I('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.2 3.4-5 6.5-5s5.7 1.8 6.5 5"/><path d="M16 5.2a3.5 3.5 0 0 1 0 5.6"/><path d="M18.5 15.4c1.6.8 2.7 2.4 3 4.6"/>',d),
 crane: d=>I('<path d="M4 21h9"/><path d="M8.5 21V8"/><path d="M4.5 8h4"/><path d="M8.5 8 19 5.5"/><path d="M19 5.5V12"/><path d="M17.5 12h3"/><path d="M19 12v3.2"/><circle cx="19" cy="16.7" r="1.5"/><path d="M8.5 12h-4v9"/>',d),
 chart: d=>I('<path d="M4 4v16h16"/><path d="M8.5 16v-5"/><path d="M13 16V7.5"/><path d="M17.5 16v-3"/>',d),
 wallet: d=>I('<path d="M20 7H5a2 2 0 0 1 0-4h13v4"/><path d="M3 5v14a2 2 0 0 0 2 2h15V7"/><path d="M16 13.5h4"/>',d),
 plus: d=>I('<path d="M12 5v14"/><path d="M5 12h14"/>',d),
 pay: d=>I('<rect x="3" y="6" width="18" height="13" rx="2.5"/><circle cx="12" cy="12.5" r="3"/><path d="M6.5 6V4.5"/>',d),

const PERM_KEYS=[['logs','permLogs'],['editDelete','permEditDelete'],['money','permMoney'],['private','permPrivate'],['projPay','permProjPay'],['manage','permManage']];
const PERMS=()=>PERM_KEYS.map(([k,tk])=>[k,T(tk)]);
const $=s=>document.querySelector(s);
/* Hebrew UI uses Latin digits (he-IL); Arabic keeps its Arabic-Indic digits (ar-EG) */
const money=n=>`<span class="num">${Number(n||0).toLocaleString(LANG==='he'?'he-IL':'ar-EG',{maximumFractionDigits:2})} ₪</span>`;
const today=()=>new Date().toISOString().slice(0,10);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
/* accept Arabic-Indic digits (٠١٢٣ / ۰۱۲۳) and normalize to Latin so Number() works */
function digits(el){
 const v=el.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,]/g,'.').replace(/[^0-9.]/g,'');
 if(v!==el.value)el.value=v;
}
function workerName(id){return db.workers.find(x=>x.id==id)?.name||T('notSet')}
function projectName(id){return db.projects.find(x=>x.id==id)?.name||T('notSet')}
/* ---------- month filtering (ym/monthLabel/monthRange/stepMonth/groupByMonth/carryOver come from month.js) ----------
   The month picker is a shortcut over the from/to filter that already exists: picking a month writes its
   first and last day into _rFrom/_rTo, so there stays exactly one filter path instead of two that can disagree. */
function monthBar(id,value,setter){
 const step=(n,label,icon)=>`<button class="step" title="${label}" aria-label="${label}" ${value?'':'disabled'} onclick="${setter}('${value?stepMonth(value,n):''}')">${icon(16)}</button>`;
 return `<div class="monthbar">${step(-1,T('prevMonth'),ic.chevR)}<input id="${id}" type="month" value="${value}" onchange="${setter}(this.value)">${step(1,T('nextMonth'),ic.chevL)}</div>`;
}
/* one chip per month that actually has data, so the months are discoverable without hunting in the picker */
function monthChips(rows,current,setter){
 const months=monthsOf(rows).filter(Boolean).slice(0,12);
 if(!months.length)return '';
 const chip=(k,label)=>`<button class="chip" style="${k===current?'background:var(--navy);color:#fff':''}" onclick="${setter}('${k}')">${label}</button>`;
 return `<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:2px">${chip('',T('allMonths'))}${months.map(k=>chip(k,ML(k,true))).join('')}</div>`;
}

 const r=_rMonth?monthRange(_rMonth):{from:'',to:''};

function setExpenseMonth(k){
 _eMonth=k||'';

 _eFrom=r.from;_eTo=r.to;

}
function stats(){
 const earned=db.logs.reduce((a,l)=>a+Number(l.wage||0),0);

 const billed=earned+profit;
 const paid=db.payments.reduce((a,p)=>a+Number(p.amount||0),0);
 return {workers:db.workers.length,projects:db.projects.length,days:db.logs.length,earned,profit,billed,paid,balance:earned-paid};
}
function toast(msg){
 $('#toast').innerHTML=`<div class="t">${ic.check(16)} ${esc(msg)}</div>`;
 clearTimeout(toast._t); toast._t=setTimeout(()=>{$('#toast').innerHTML=''},2200);
}
function undoToast(msg,restoreFn){

 clearTimeout(toast._t); toast._t=setTimeout(()=>{$('#toast').innerHTML=''},6000);

/* preview before commit to paper: same overlay pattern as modal()/viewSheet(), styled as a document viewer (gray canvas + white page) rather than a generic app modal */
function printPreview(title,html){
 closePrintPreview();
 const wrap=document.createElement('div');wrap.id='printpreview';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${T('printPreview')}</span><button class="x" aria-label="${T('close')}" title="${T('close')}" onclick="closePrintPreview()">${ic.x(17)}</button></div><div class="pp-paper">${html}</div><div class="actions" style="margin-top:14px"><button class="btn primary" id="ppPrintBtn">${ic.print(16)} ${T('print')}</button><button class="btn secondary" onclick="closePrintPreview()">${T('close')}</button></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closePrintPreview()});

 $('#ppPrintBtn').onclick=()=>{closePrintPreview();printSheet(title,html);};

function buildNav(){

const PARTNERS=()=>[['me',T('myExpenses')],['brother',T('brotherExpenses')]];

function expenses(){

 else if(diff===0)settleLine=T('settledEven');
 else if(diff>0)settleLine=T('settleBrotherOwesYou').replace('{amt}',money(diff/2));
 else settleLine=T('settleYouOweBrother').replace('{amt}',money(Math.abs(diff)/2));
 const expRow=x=>`<div class="item"><div class="lead"><span class="avatar">${esc((x.partner==='me'?T('myExpenses'):T('brotherExpenses')).trim().charAt(0))}</span><div class="tx"><b>${esc(x.note||T('newExpense'))}</b><br><small>${partnerLabel(x.partner)}${x.projectId?' • '+esc(projectName(x.projectId)):''} • <span class="num">${esc(x.date)}</span></small></div></div>

   <button class="iconbtn del" title="${T('delete')}" onclick="delExpense('${x.id}')">${ic.trash(16)}</button>`:''}

  ?emptyState(ic.pay,T('noExpensesTitle'),T('noExpensesHint'),`<button class="btn primary" onclick="newExpense()">${ic.plus(16)} ${T('newExpense')}</button>`)

 <div class="card"><h3>${T('expenseSettlement')}</h3><div class="grid">
 <div><span class="muted">${T('myExpenses')}</span><br><b style="color:var(--blue)">${money(meTotal)}</b></div><div><span class="muted">${T('brotherExpenses')}</span><br><b style="color:var(--purple)">${money(brTotal)}</b></div></div>

 <div class="actions"><button class="btn primary wide" onclick="newExpense()">${ic.plus(17)} ${T('newExpense')}</button></div>`;
}
function expenseForm(x={}){

function delExpense(id){

/* ---------- users CRUD ---------- */
function userForm(u={}){
 return F('un',T('username'),`<input id="un" value="${esc(u.name||'')}">`)
 +F('up',u.id?T('passwordKeep'):T('passwordSet'),`<input id="up" type="password">`)
 +F('up2',T('confirmPassword'),`<input id="up2" type="password">`)
 +`<div class="field"><label>${T('permsLabel')}</label>
   <div class="permrow"><input type="checkbox" id="uadmin" ${u.isAdmin?'checked':''} onchange="document.getElementById('permlist').style.opacity=this.checked?.4:1"> <b>${T('adminPerm')}</b></div>
   <div id="permlist" style="opacity:${u.isAdmin?.4:1}">${PERMS().map(([k,l])=>`<div class="permrow"><input type="checkbox" id="perm-${k}" ${u.perms&&u.perms[k]?'checked':''}> ${l}</div>`).join('')}</div></div>`;
}
function readUserForm(existing){
 const name=$('#un').value.trim();
 if(!name)return fieldErr('un',T('errUsername')),null;
 const pass=$('#up').value;
 if(!existing&&!pass)return fieldErr('up',T('errPassword')),null;
 if(pass&&pass!==$('#up2').value)return fieldErr('up2',T('errPasswordMismatch')),null;
 const perms={};PERMS().forEach(([k])=>perms[k]=$('#perm-'+k).checked);
 return {name,pass:pass||undefined,isAdmin:$('#uadmin').checked,perms};
}
function newUser(){
 modal(T('addUser'),userForm(),()=>{
  const v=readUserForm(false);if(!v)return false;
  window.api.addUser({id:crypto.randomUUID(),...v}).then(()=>render());
  toast(T('toastUsersAdded'));return true});
}
async function editUser(id){
 const u=(await window.api.listUsers()).find(x=>x.id===id);
 modal(T('editUserTitle'),userForm(u),()=>{
  const v=readUserForm(true);if(!v)return false;
  window.api.updateUser({id,...v}).then(()=>{
   if(CU.id===id){CU={...CU,name:v.name,isAdmin:v.isAdmin,perms:v.perms};buildNav()}
   render();
  });
  toast(T('toastUserSaved'));return true});
}
async function delUser(id){
 const u=(await window.api.listUsers()).find(x=>x.id===id);
 confirmBox(T('confirmDeleteUser'),T('confirmDeleteUserBody').replace('{name}',`<b>${esc(u.name)}</b>`),async()=>{
  const ok=await window.api.deleteUser(id);
  toast(ok?T('toastUserDeleted'):T('toastUserDeleteBlocked'));render();
 });
}

/* ---------- auth ---------- */
function authScreen(state){
 const wrap=document.createElement('div');wrap.id='auth';
 const mark=`<div class="amark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a7 7 0 0 0-7 7v2h14v-2a7 7 0 0 0-7-7Z"/><path d="M3 15h18"/><path d="M12 3v4"/></svg></div>`;
 const langToggle=`<div class="userpick" style="margin-bottom:14px"><button type="button" class="${LANG==='ar'?'sel':''}" onclick="event.preventDefault();changeLangPre('ar')">${T('langArabic')}</button><button type="button" class="${LANG==='he'?'sel':''}" onclick="event.preventDefault();changeLangPre('he')">${T('langHebrew')}</button></div>`;
 if(state.needsSetup){
  wrap.innerHTML=`<div class="authbox">${mark}<h2>${T('welcomeSetup')}</h2><p class="sub">${T('setupHint')}</p>${langToggle}
   ${F('an',T('yourName'),`<input id="an">`)}${F('ap',T('passwordLabel'),`<input id="ap" type="password">`)}${F('ap2',T('confirmPassword'),`<input id="ap2" type="password">`)}
   <button class="btn primary wide" id="authGo">${T('createAccount')}</button></div>`;
 }else{
  wrap.innerHTML=`<div class="authbox">${mark}<h2>${T('loginTitle')}</h2><p class="sub">${T('loginHint')}</p>${langToggle}
   <div class="userpick">${state.names.map(n=>`<button data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>
   ${F('ap',T('passwordLabel'),`<input id="ap" type="password">`)}
   <button class="btn primary wide" id="authGo">${T('loginBtn')}</button></div>`;
  wrap.querySelectorAll('.userpick button[data-n]').forEach(b=>b.onclick=()=>{
   wrap.querySelectorAll('.userpick button[data-n]').forEach(x=>x.classList.remove('sel'));
   b.classList.add('sel');$('#ap').focus();
  });
  if(state.names.length===1)wrap.querySelector('.userpick button[data-n]')?.classList.add('sel');
 }
 document.body.appendChild(wrap);
 const go=async()=>{
  if(state.needsSetup){
   if(!$('#an').value.trim())return fieldErr('an',T('errName'));
   if(!$('#ap').value)return fieldErr('ap',T('errPassword'));
   if($('#ap').value!==$('#ap2').value)return fieldErr('ap2',T('errPasswordMismatch'));
   const u=await window.api.setupAdmin({name:$('#an').value.trim(),pass:$('#ap').value});
   if(u)enterApp(u);
  }else{
   const sel=wrap.querySelector('.userpick button[data-n].sel');
   if(!sel)return fieldErr('ap',T('errChooseUser'));
   const u=await window.api.login({name:sel.dataset.n,pass:$('#ap').value});
   if(!u)return fieldErr('ap',T('errWrongPassword'));
   enterApp(u);
  }
 };
 $('#authGo').onclick=go;
 wrap.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 const f=wrap.querySelector('input,button');if(f)f.focus();
}
/* language toggle before login: same shared setting as Settings, just exposed earlier since the
   app is otherwise 100% one language even before anyone logs in */
async function changeLangPre(l){
 if(l===LANG)return;
 await window.api.setLang(l);
 LANG=l;
 document.documentElement.lang=l;
 authScreen(await window.api.authState());
}
function enterApp(u){
 CU=u;$('#auth')?.remove();$('#logoutBtn').style.display='';
 $('#logoutBtn').title=T('logout');$('#logoutBtn').setAttribute('aria-label',T('logout'));
 buildNav();page='home';render();
}
async function logout(){
 CU=null;$('#logoutBtn').style.display='none';$('#nav').innerHTML='';$('#main').innerHTML='';
 $('#title').textContent=T('appTitle');$('#subtitle').textContent=T('appSubtitle');
 authScreen(await window.api.authState());
}

/* ---------- modal + validation ---------- */
function modal(title,body,onSave,saveLabel=T('save')){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()" title="${T('close')}" aria-label="${T('close')}">${ic.x(17)}</button></div><div class="body">${body}<div class="actions" style="margin-top:14px"><button class="btn primary" id="saveBtn">${saveLabel}</button><button class="btn secondary" onclick="closeModal()">${T('cancel')}</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#saveBtn').onclick=()=>{if(onSave())closeModal()};
 const f=wrap.querySelector('input,select,textarea'); if(f)f.focus();
}
function closeModal(){$('#modal')?.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeView();closePrintPreview()}});
function fieldErr(id,msg){
 const el=$('#'+id); const f=el.closest('.field'); f.classList.add('err');
 f.querySelector('.msg').textContent=msg;
 el.addEventListener('input',()=>f.classList.remove('err'),{once:true});
 el.focus(); return false;
}
const F=(id,label,inner)=>`<div class="field"><label for="${id}">${label}</label>${inner}<div class="msg"></div></div>`;

function confirmBox(title,body,onYes,yesLabel=T('delete')){
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" onclick="closeModal()" title="${T('close')}" aria-label="${T('close')}">${ic.x(17)}</button></div><div class="body"><div style="display:flex;gap:12px;align-items:flex-start"><span class="tint-red" style="width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none">${ic.warn(19)}</span><p style="margin:6px 0 14px">${body}</p></div><div class="actions"><button class="btn danger" id="yesBtn">${yesLabel}</button><button class="btn secondary" onclick="closeModal()">${T('cancel')}</button></div></div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 $('#yesBtn').onclick=()=>{onYes();closeModal()};
}

/* ---------- worker/project detail view ---------- */
function viewSheet(title,body){
 const wrap=document.createElement('div');wrap.id='viewsheet';wrap.className='overlay';
 wrap.innerHTML=`<div class="sheet"><div class="head"><span>${title}</span><button class="x" aria-label="${T('close')}" title="${T('close')}" onclick="closeView()">${ic.x(17)}</button></div><div class="body">${body}</div></div>`;
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeView()});
 document.body.appendChild(wrap);
}
function closeView(){$('#viewsheet')?.remove();_openWorker=null}
function refreshWorkerSheet(){if(_openWorker){closeView();workerDetail(_openWorker)}}
function workerDetail(workerId,projectId=''){
 _openWorker=projectId?null:workerId;
 closeView();
 const w=db.workers.find(x=>x.id===workerId);
 if(!w){toast(T('toastWorkerNotFound'));return}
 const head=`<div class="item" style="padding-top:0;border:0"><div class="lead"><span class="avatar">${esc(w.name.trim().charAt(0))}</span><div class="tx"><h3>${esc(w.name)}</h3><small>${esc(w.job||T('worker'))}${w.phone?' • <span class="num">'+esc(w.phone)+'</span>':''}${can('private')&&w.idNumber?' • '+T('idLabelShort')+' <span class="num">'+esc(w.idNumber)+'</span>':''}</small></div></div></div>`;
 let body;
 if(projectId){
  const logs=db.logs.filter(l=>l.workerId===workerId&&l.projectId===projectId);
  const hours=logs.reduce((a,l)=>a+Number(l.hours||0),0), wage=logs.reduce((a,l)=>a+Number(l.wage||0),0);
  body=head+`<hr><span class="muted">${T('project')}</span><h3 style="margin:2px 0 10px">${esc(projectName(projectId))}</h3>
  <div class="row3"><div><span class="muted">${T('days')}</span><br><b class="num">${logs.length}</b></div><div><span class="muted">${T('hours')}</span><br><b class="num">${hours}</b></div>${can('money')?`<div><span class="muted">${T('workerWage')}</span><br><b style="color:var(--green)">${money(wage)}</b></div>`:'<div></div>'}</div>
  <hr>${logs.length?logs.map(l=>logRow(l,true)).join(''):emptyState(ic.cal,T('noLogsTitle'),T('noLogsProjectHint'))}
  <button class="btn secondary wide" style="margin-top:10px" onclick="workerDetail('${workerId}')">${ic.users(15)} ${T('fullProfile')}</button>`;
 }else{
  const logs=db.logs.filter(l=>l.workerId===workerId);
  const earned=logs.reduce((a,l)=>a+Number(l.wage||0),0);
  const paid=db.payments.filter(p=>p.workerId===workerId).reduce((a,p)=>a+Number(p.amount||0),0);
  const orphanLogs=logs.filter(l=>!l.projectId||!db.projects.some(p=>p.id===l.projectId));
  const orphanWage=orphanLogs.reduce((a,l)=>a+Number(l.wage||0),0);
  const orphanRows=[...orphanLogs].sort((a,b)=>b.date.localeCompare(a.date)).map(l=>logRow(l,true)).join('');
  const orphanWarning=orphanLogs.length?`<div class="card" style="border:1px solid var(--red);background:var(--red-soft);margin:10px 0 0">
   <div style="display:flex;gap:10px;align-items:flex-start"><span class="tint-red" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none">${ic.warn(17)}</span>
   <div style="flex:1;min-width:0"><b style="color:var(--red)"><span class="num">${orphanLogs.length}</span> ${T('orphanLogsWarn')}</b>
   <p class="muted" style="margin:4px 0 10px">${T('orphanLogsHint')}${can('money')?` ${T('due')} ${money(orphanWage)}`:''}. ${T('orphanLogsAction')}</p>
   ${orphanRows}
   <button class="btn danger" style="margin-top:10px" onclick="deleteOrphanLogs('${workerId}')">${ic.trash(16)} ${T('deleteOrphans')}</button></div></div></div>`:'';
  const byP={};logs.forEach(l=>{const k=l.projectId||'';byP[k]=byP[k]||{days:0,wage:0};byP[k].days++;byP[k].wage+=Number(l.wage||0)});
  const projRows=Object.entries(byP).map(([pid,v])=>`<div class="item"><div class="tx"><b>${esc(pid?projectName(pid):T('noProjectLabel'))}</b></div><div style="text-align:left"><span class="num">${v.days}</span> ${T('logShort')}${can('money')?` • ${money(v.wage)}`:''}</div></div>`).join('')||emptyState(ic.crane,T('noProjectsForWorker'),T('noProjectsForWorkerHint'));
  /* diaries split per month, newest month open — native <details>, so no collapse state to track */
  const monthGroups=groupByMonth([...logs].sort((a,b)=>b.date.localeCompare(a.date)));
  const allLogsHtml=monthGroups.length?monthGroups.map(([k,ls],i)=>{
   const wage=ls.reduce((a,l)=>a+Number(l.wage||0),0),hrs=ls.reduce((a,l)=>a+Number(l.hours||0),0);
   return `<details class="msec"${i===0?' open':''}><summary><span>${ML(k,true)}</span><span class="msum"><span class="num">${ls.length}</span> ${T('logShort')} · <span class="num">${hrs}</span> ${T('hourUnit')}${can('money')?' · '+money(wage):''}</span></summary>
   <div class="mbody">${ls.map(l=>logRow(l,true)).join('')}
   ${k?`<button class="btn secondary wide" style="margin-top:8px" onclick="printWorkerFull('${workerId}','${k}')">${ic.print(15)} ${T('printMonthSlip')} ${ML(k,true)}</button>`:''}</div></details>`;
  }).join(''):emptyState(ic.cal,T('noLogsTitle'),T('noLogsHint'));
  const pays=db.payments.filter(p=>p.workerId===workerId).slice(-5).reverse();
  const paysHtml=pays.map(p=>`<div class="item"><div class="tx"><small><span class="num">${esc(p.date)}</span> • ${esc(p.note||T('payment'))}</small></div><div class="rowicons"><b style="color:var(--orange)">${money(p.amount)}</b>${can('editDelete')?`
   <button class="iconbtn" title="${T('edit')}" onclick="editPayment('${p.id}')">${ic.edit(16)}</button>
   <button class="iconbtn del" title="${T('delete')}" onclick="delPayment('${p.id}')">${ic.trash(16)}</button>`:''}</div></div>`).join('')||emptyState(ic.pay,T('noPaymentsTitle'),T('noPaymentsHint'));
  body=head
   +orphanWarning
   +(can('money')?`<hr><div class="row3"><div><span class="muted">${T('due')}</span><br><b style="color:var(--green)">${money(earned)}</b></div><div><span class="muted">${T('paidAmount')}</span><br><b style="color:var(--orange)">${money(paid)}</b></div><div><span class="muted">${T('balance')}</span><br><b>${money(earned-paid)}</b></div></div>`:'')
   +`<hr><span class="muted">${T('navProjects')}</span>${projRows}`
   +`<hr><span class="muted">${T('monthsByLogs')}</span>${allLogsHtml}`
   +(can('money')?`<hr><span class="muted">${T('lastPayments')}</span>${paysHtml}`:'')
   +`<div class="actions" style="margin-top:14px">${can('logs')?`<button class="btn primary" onclick="newLog('${workerId}')">${ic.plus(16)} ${T('addLog')}</button><button class="btn success" onclick="newPayment('${workerId}')">${ic.pay(16)} ${T('payment')}</button>`:''}</div>`
   +(can('logs')?`<button class="btn secondary wide" style="margin-top:10px" onclick="printWorkerFull('${workerId}')">${ic.print(16)} ${T('printAllMonths')}</button>`:'');
 }
 viewSheet(w.name,body);
}

/* ---------- workers CRUD ---------- */
let _photos={};
function renderPhotoBox(kind){
 const box=$('#ph-'+kind); if(!box)return;
 const name=_photos[kind];
 const empty=`<button type="button" class="addph" onclick="pickPhoto('${kind}')">${ic.plus(18)} ${T('addPhoto')}</button>`;
 if(!name){box.innerHTML=empty;return}
 window.api.photoUrl(name).then(u=>{
  box.innerHTML=u?`<img src="${u}" onclick="window.api.openPhoto('${name}')" title="${T('viewPhoto')}"><button type="button" class="rmph" onclick="removePhoto('${kind}')" title="${T('removePhoto')}">${ic.x(14)}</button>`:empty;
 });
}
async function pickPhoto(kind){const r=await window.api.pickPhoto();if(!r)return;_photos[kind]=r.name;renderPhotoBox(kind)}
function removePhoto(kind){_photos[kind]='';renderPhotoBox(kind)}
function workerForm(w={}){
 return F('n',T('workerName'),`<input id="n" value="${esc(w.name||'')}">`)
 +`<div class="row">${F('p',T('phone'),`<input id="p" inputmode="tel" value="${esc(w.phone||'')}">`)}${F('j',T('job'),`<input id="j" placeholder="${T('jobPlaceholder')}" value="${esc(w.job||'')}">`)}</div>`
 +`<div class="row">${F('idn',T('idNumber'),`<input id="idn" inputmode="numeric" value="${esc(w.idNumber||'')}">`)}${F('w',T('defaultDailyWage'),`<input id="w" type="text" inputmode="decimal" oninput="digits(this)" value="${w.defaultWage??''}">`)}</div>`
 +F('wp',T('defaultProfit'),`<input id="wp" type="text" inputmode="decimal" oninput="digits(this)" value="${w.defaultProfit??0}">`)
 +`<div class="row">${F('bn',T('bankName'),`<input id="bn" value="${esc(w.bankName||'')}">`)}${F('ba',T('bankAccount'),`<input id="ba" inputmode="numeric" value="${esc(w.bankAccount||'')}">`)}</div>`
 +`<div class="row"><div class="field"><label>${T('idPhoto')}</label><div class="photobox" id="ph-idPhoto"></div></div><div class="field"><label>${T('permitPhoto')}</label><div class="photobox" id="ph-permitPhoto"></div></div></div>`;
}
function readWorkerExtra(){
 return {idNumber:$('#idn').value.trim(),bankName:$('#bn').value.trim(),bankAccount:$('#ba').value.trim(),idPhoto:_photos.idPhoto||'',permitPhoto:_photos.permitPhoto||''};
}
function newWorker(){
 _photos={};
 modal(T('newWorkerTitle'),workerForm(),()=>{
  if(!$('#n').value.trim())return fieldErr('n',T('errWorkerName'));
  const w={id:crypto.randomUUID(),name:$('#n').value.trim(),phone:$('#p').value,job:$('#j').value,defaultWage:Number($('#w').value||0),defaultProfit:Number($('#wp').value||0),...readWorkerExtra()};
  db.workers.push(w);window.api.addWorker(w);render();toast(T('toastWorkerAdded'));return true});
 renderPhotoBox('idPhoto');renderPhotoBox('permitPhoto');
}
function editWorker(id){
 const w=db.workers.find(x=>x.id===id);
 _photos={idPhoto:w.idPhoto||'',permitPhoto:w.permitPhoto||''};
 const origPhotos={..._photos};
 modal(T('editWorkerTitle'),workerForm(w),()=>{
  if(!$('#n').value.trim())return fieldErr('n',T('errWorkerName'));
  Object.assign(w,{name:$('#n').value.trim(),phone:$('#p').value,job:$('#j').value,defaultWage:Number($('#w').value||0),defaultProfit:Number($('#wp').value||0)},readWorkerExtra());
  window.api.updateWorker(w);
  /* only delete the OLD file, and only once the swap is actually committed — never on cancel */
  for(const k of ['idPhoto','permitPhoto'])if(origPhotos[k]&&origPhotos[k]!==_photos[k])window.api.deletePhoto(origPhotos[k]);
  render();toast(T('toastWorkerSaved'));return true});
 renderPhotoBox('idPhoto');renderPhotoBox('permitPhoto');
}
function delWorker(id){
 const w=db.workers.find(x=>x.id===id);
 const logs=db.logs.filter(l=>l.workerId===id), pays=db.payments.filter(p=>p.workerId===id);
 confirmBox(T('confirmDeleteWorker'),T('confirmDeleteWorkerBody').replace('{name}',`<b>${esc(w.name)}</b>`).replace('{logs}',`<span class="num">${logs.length}</span>`).replace('{pays}',`<span class="num">${pays.length}</span>`),()=>{
  db.workers=db.workers.filter(x=>x.id!==id);
  db.logs=db.logs.filter(l=>l.workerId!==id);
  db.payments=db.payments.filter(p=>p.workerId!==id);
  window.api.deleteWorker(id);render();
  undoToast(T('toastWorkerDeleted'),()=>{
   db.workers.push(w);window.api.addWorker(w);
   logs.forEach(l=>{db.logs.push(l);window.api.addLog(l)});
   pays.forEach(p=>{db.payments.push(p);window.api.addPayment(p)});
   render();toast(T('toastWorkerRestored'));
  });
 });
}

/* ---------- projects CRUD ---------- */
function projectForm(p={}){
 return F('n',T('projectName'),`<input id="n" value="${esc(p.name||'')}">`)
 +F('l',T('location'),`<input id="l" value="${esc(p.location||'')}">`)
 +F('d',T('startDate'),`<input id="d" type="date" value="${esc(p.start||today())}">`);
}
function newProject(){
 modal(T('newProjectTitle'),projectForm(),()=>{
  if(!$('#n').value.trim())return fieldErr('n',T('errProjectName'));
  const p={id:crypto.randomUUID(),name:$('#n').value.trim(),location:$('#l').value,start:$('#d').value};
  db.projects.push(p);window.api.addProject(p);render();toast(T('toastProjectAdded'));return true});
}
function editProject(id){
 const p=db.projects.find(x=>x.id===id);
 modal(T('editProjectTitle'),projectForm(p),()=>{
  if(!$('#n').value.trim())return fieldErr('n',T('errProjectName'));
  Object.assign(p,{name:$('#n').value.trim(),location:$('#l').value,start:$('#d').value});
  window.api.updateProject(p);render();toast(T('toastProjectSaved'));return true});
}
function delProject(id){
 const p=db.projects.find(x=>x.id===id);
 const pays=db.projectPayments.filter(x=>x.projectId===id);
 confirmBox(T('confirmDeleteProject'),T('confirmDeleteProjectBody').replace('{name}',`<b>${esc(p.name)}</b>`),()=>{
  db.projects=db.projects.filter(x=>x.id!==id);
  db.projectPayments=db.projectPayments.filter(x=>x.projectId!==id);
  window.api.deleteProject(id);render();
  undoToast(T('toastProjectDeleted'),()=>{
   db.projects.push(p);window.api.addProject(p);
   pays.forEach(x=>{db.projectPayments.push(x);window.api.addProjectPayment(x)});
   render();toast(T('toastProjectRestored'));
  });
 });
}
function toggleProjectDone(id){
 const p=db.projects.find(x=>x.id===id);
 p.done=!p.done;window.api.updateProject(p);filterProjects();
 toast(p.done?T('toastProjectFinished'):T('toastProjectReactivated'));
}

/* ---------- project payments CRUD ---------- */
function projectPaymentForm(pp={},preProject=''){
 const pid=pp.projectId||preProject;
 const opts=db.projects.map(p=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.name)}</option>`).join('');
 return F('pj',T('project'),`<select id="pj"><option value="">${T('chooseProject')}</option>${opts}</select>`)
 +`<div class="row">${F('am',T('amount'),`<input id="am" type="text" inputmode="decimal" oninput="digits(this)" value="${pp.amount??''}">`)}${F('dt',T('date'),`<input id="dt" type="date" value="${esc(pp.date||today())}">`)}</div>`
 +F('note',T('notes'),`<input id="note" placeholder="${T('fromOwnerNote')}" value="${esc(pp.note||'')}">`);
}
function readProjectPaymentForm(){
 if(!$('#pj').value){fieldErr('pj',T('errChooseProject'));return null}
 if(!Number($('#am').value)){fieldErr('am',T('errAmount'));return null}
 return {projectId:$('#pj').value,amount:Number($('#am').value),date:$('#dt').value,note:$('#note').value};
}
function newProjectPayment(projectId=''){
 modal(T('newProjPaymentTitle'),projectPaymentForm({},projectId),()=>{
  const v=readProjectPaymentForm();if(!v)return false;
  const pp={id:crypto.randomUUID(),...v};

/* company-facing project print: shows the billed amount only, never worker wage or your profit.
   monthKey='' prints every month, banded with a subtotal each; one month key prints that month
   alone, flat (no banding needed — the whole table already is that one month). */
function companyReportHtml(projectId,monthKey=''){
 const p=db.projects.find(x=>x.id===projectId);
 let logs=[...db.logs.filter(l=>l.projectId===projectId)].sort((a,b)=>a.date.localeCompare(b.date));
 let pays=[...db.projectPayments.filter(x=>x.projectId===projectId)].sort((a,b)=>a.date.localeCompare(b.date));
 if(monthKey){logs=logs.filter(l=>ym(l.date)===monthKey);pays=pays.filter(x=>ym(x.date)===monthKey);}
 const totalBilled=logs.reduce((a,l)=>a+Number(l.wage||0)+Number(l.profit||0),0);
 const totalReceived=pays.reduce((a,x)=>a+Number(x.amount||0),0);
 const logRow=l=>`<tr><td>${esc(l.date)}</td><td>${esc(workerName(l.workerId))}</td><td>${esc(l.hours||0)}</td><td>${esc(l.type||'')}</td><td>${money(Number(l.wage||0)+Number(l.profit||0))}</td></tr>`;
 const logsRows=!logs.length?`<tr><td colspan="5">${T('noRecords')}</td></tr>`
  :monthKey?logs.map(logRow).join('')
  :groupByMonth(logs,false).map(([k,ls])=>{
    const sub=ls.reduce((a,l)=>a+Number(l.wage||0)+Number(l.profit||0),0);
    return `<tr class="mhead"><td colspan="5">${ML(k)}</td></tr>`+ls.map(logRow).join('')
     +`<tr class="msub"><td colspan="4">${T('monthlyTotal')} ${ML(k,true)} — <span class="num">${ls.length}</span> ${T('logShort')}</td><td>${money(sub)}</td></tr>`;
   }).join('');
 const paysRows=pays.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.note||'')}</td><td>${money(x.amount)}</td></tr>`).join('')||`<tr><td colspan="3">${T('noPaymentsDoc')}</td></tr>`;
 return `<p class="muted">${esc(p?.location||'')}${p?.start?' • '+esc(p.start):''}</p>
 <h4>${T('workRecords')}</h4><table class="ptable"><thead><tr><th>${T('date')}</th><th>${T('worker')}</th><th>${T('hours')}</th><th>${T('workType')}</th><th>${T('amountPlain')}</th></tr></thead><tbody>${logsRows}</tbody><tfoot><tr><td colspan="4">${T('grandTotal')}</td><td>${money(totalBilled)}</td></tr></tfoot></table>
 <h4>${T('receivedPayments')}</h4><table class="ptable"><thead><tr><th>${T('date')}</th><th>${T('notes')}</th><th>${T('amountPlain')}</th></tr></thead><tbody>${paysRows}</tbody><tfoot><tr><td colspan="2">${T('grandTotal')}</td><td>${money(totalReceived)}</td></tr></tfoot></table>`;
}
function printProject(id,monthKey=''){
 const p=db.projects.find(x=>x.id===id);
 const base=p?p.name:T('project');
 const title=monthKey?`${base} — ${ML(monthKey,true)}`:base;
 const docType=monthKey?`${T('projectReport')} — ${ML(monthKey)}`:`${T('projectReport')} — ${T('allMonthsDoc')}`;
 printPreview(title,printDocHead(title,docType)+companyReportHtml(id,monthKey));
}
/* month picker shown before printing a project statement — lets the contractor choose one month
   or the whole history instead of always getting every month at once */
let _ppMonth='',_ppRedraw=null;
function pickProjectPrintMonth(k){_ppMonth=k||'';if(_ppRedraw)_ppRedraw()}
function printProjectPicker(id){
 _ppMonth='';
 const p=db.projects.find(x=>x.id===id);
 const logs=db.logs.filter(l=>l.projectId===id);
 const wrap=document.createElement('div');wrap.id='modal';wrap.className='overlay';
 wrap.addEventListener('mousedown',e=>{if(e.target===wrap)closeModal()});
 document.body.appendChild(wrap);
 _ppRedraw=()=>{
  wrap.innerHTML=`<div class="sheet"><div class="head"><span>${T('printProjectSheet')} ${esc(p?p.name:T('project'))}</span><button class="x" onclick="closeModal()" title="${T('close')}" aria-label="${T('close')}">${ic.x(17)}</button></div><div class="body">
   <div class="field"><label>${T('month')}</label>${monthBar('ppm',_ppMonth,'pickProjectPrintMonth')}${monthChips(logs,_ppMonth,'pickProjectPrintMonth')}</div>
   <p class="muted" style="margin:0 0 14px">${_ppMonth?`${T('printingMonth')}: <b>${ML(_ppMonth)}</b>`:T('printingAll')}</p>
   <div class="actions"><button class="btn primary" id="ppGo">${ic.print(16)} ${T('print')}</button><button class="btn secondary" onclick="closeModal()">${T('cancel')}</button></div>
  </div></div>`;
  $('#ppGo').onclick=()=>{const m=_ppMonth;closeModal();printProject(id,m)};
 };

}
/* worker-facing print: handed to the worker to see his own record. Must NEVER show your profit or the company-billed total — only his wage. Wage figures still gated by can('money') so a limited-access user printing this doesn't see money either. */
function printWorkerFull(workerId,monthKey=''){
 const w=db.workers.find(x=>x.id===workerId);
 if(!w)return;
 const allLogs=db.logs.filter(l=>l.workerId===workerId);
 const allPays=db.payments.filter(p=>p.workerId===workerId);
 const showMoney=can('money');
 /* month is the outer section and the project becomes a column: one month = one page = one payslip
    the worker signs. Oldest month first so the carry-over lines read forward in time. */
 const groups=groupByMonth([...allLogs].sort((a,b)=>a.date.localeCompare(b.date)),false)
  .filter(([k])=>!monthKey||k===monthKey);
 const blocks=groups.map(([k,ls])=>{
  const rows=ls.map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.projectId?projectName(l.projectId):T('noProjectLabel'))}</td><td>${esc(l.hours||0)}</td><td>${esc(l.type||'')}</td>${showMoney?`<td>${money(l.wage)}</td>`:''}</tr>`).join('');
  const c=carryOver(allLogs,allPays,k);
  const foot=`<tfoot><tr><td colspan="${showMoney?4:3}">${T('monthTotalLabel')} — <span class="num">${c.days}</span> ${T('logShort')} · <span class="num">${c.hours}</span> ${T('hourUnit')}</td>${showMoney?`<td>${money(c.earned)}</td>`:''}</tr></tfoot>`;
  const monthPays=[...allPays.filter(p=>ym(p.date)===k)].sort((a,b)=>a.date.localeCompare(b.date));
  const paysTable=showMoney&&monthPays.length?`<table class="ptable"><thead><tr><th>${T('paymentDateLabel')}</th><th>${T('notes')}</th><th>${T('amountPlain')}</th></tr></thead><tbody>${monthPays.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.note||'')}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">${T('paidInMonth')}</td><td>${money(c.paid)}</td></tr></tfoot></table>`:'';
  const settle=showMoney?`<table class="month-sum"><tbody>
   <tr><td>${T('prevBalance')}</td><td>${money(c.prev)}</td></tr>
   <tr><td>${T('monthDue')}</td><td>${money(c.earned)}</td></tr>
   <tr><td>${T('monthPaid')}</td><td>${money(c.paid)}</td></tr>
   <tr class="final"><td>${T('currentBalance')}</td><td>${money(c.balance)}</td></tr></tbody></table>`:'';
  return `<div class="month-block"><div class="month-title">${ML(k)}</div>
   <table class="ptable"><thead><tr><th>${T('date')}</th><th>${T('project')}</th><th>${T('hours')}</th><th>${T('workType')}</th>${showMoney?`<th>${T('workerWage')}</th>`:''}</tr></thead><tbody>${rows}</tbody>${foot}</table>
   ${paysTable}${settle}${sigBlock()}</div>`;
 }).join('')||`<p>${T('noLogsDoc')}</p>`;
 /* the all-time figures only make sense on the full statement; a single-month payslip already
    ends with the running balance for that month */
 let summary='';
 if(showMoney&&!monthKey){
  const totalEarned=allLogs.reduce((a,l)=>a+Number(l.wage||0),0);
  const totalPaid=allPays.reduce((a,p)=>a+Number(p.amount||0),0);
  summary=`<p><b>${T('totalDueColon')}:</b> ${money(totalEarned)} &nbsp; <b>${T('paidColon')}:</b> ${money(totalPaid)} &nbsp; <b>${T('balanceColon')}:</b> ${money(totalEarned-totalPaid)}</p>`;
 }
 const extra=[can('private')&&w.idNumber?T('idLabelShort')+' <span class="num">'+esc(w.idNumber)+'</span>':'',w.bankName?T('bankShort')+': '+esc(w.bankName):'',w.bankAccount?T('accountShort')+': <span class="num">'+esc(w.bankAccount)+'</span>':''].filter(Boolean).join(' • ');
 const title=monthKey?`${w.name} — ${ML(monthKey,true)}`:w.name;
 const docType=monthKey?`${T('workerStatementDoc')} — ${ML(monthKey)}`:`${T('workerStatementDoc')} — ${T('allMonthsDoc')}`;
 printPreview(title,printDocHead(title,docType)+`<p class="muted">${esc(w.job||'')}${w.phone?' • '+esc(w.phone):''}${extra?' • '+extra:''}</p>${summary}${blocks}`);
}

/* ---------- logs CRUD ---------- */
function logForm(l={},preWorker=''){
 const wid=l.workerId||preWorker;
 const opts=db.workers.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('');
 const propts=db.projects.map(p=>`<option value="${p.id}" ${p.id===l.projectId?'selected':''}>${esc(p.name)}</option>`).join('');
 const startWorker=db.workers.find(w=>w.id===wid);
 const wageVal=l.wage??(startWorker?startWorker.defaultWage:'')??'';
 const profitVal=l.profit??(startWorker?startWorker.defaultProfit:0)??0;
 const billedVal=(Number(wageVal||0)+Number(profitVal||0))||'';
 return F('wi',T('workerReq'),`<select id="wi" onchange="fillDefaultWage()"><option value="">${T('chooseWorker')}</option>${opts}</select>`)
 +F('pi',T('projectReq'),`<select id="pi"><option value="">${T('chooseProject')}</option>${propts}</select>`)
 +`<div class="row">${F('dt',T('date'),`<input id="dt" type="date" value="${esc(l.date||today())}">`)}${F('hr',T('hoursCount'),`<input id="hr" type="text" inputmode="decimal" oninput="digits(this)" value="${l.hours??8}">`)}</div>`
 +`<div class="row">${F('wg',T('workerWageReq'),`<input id="wg" type="text" inputmode="decimal" oninput="digits(this);syncWage('wg')" value="${wageVal}">`)}${F('pf',T('dailyProfit'),`<input id="pf" type="text" inputmode="decimal" oninput="digits(this);syncWage('pf')" value="${profitVal}">`)}</div>`
 +F('bl',T('dueFromCompanyField'),`<input id="bl" type="text" inputmode="decimal" oninput="digits(this);syncWage('bl')" value="${billedVal}">`)
 +(l.id?'':F('pay',T('todayAdvance'),`<input id="pay" type="text" inputmode="decimal" oninput="digits(this)" value="0">`))
 +F('type',T('workType'),`<input id="type" placeholder="${T('workTypePlaceholder')}" value="${esc(l.type||'')}">`)
 +F('note',T('notes'),`<textarea id="note">${esc(l.note||'')}</textarea>`);
}
function syncWage(src){
 const wg=Number($('#wg').value||0),pf=Number($('#pf').value||0),bl=Number($('#bl').value||0);
 if(src==='bl')$('#pf').value=Math.round((bl-wg)*100)/100;
 else $('#bl').value=Math.round((wg+pf)*100)/100;
}
function fillDefaultWage(){
 const w=db.workers.find(x=>x.id===$('#wi').value);
 if(w){$('#wg').value=w.defaultWage||0;$('#pf').value=w.defaultProfit||0;syncWage('wg');}
}
function readLogForm(){
 const wid=$('#wi').value;if(!wid){fieldErr('wi',T('errChooseWorker'));return null}
 if(!$('#pi').value){fieldErr('pi',T('errChooseProjectFirst'));return null}
 const worker=db.workers.find(w=>w.id===wid);const wage=Number($('#wg').value||worker.defaultWage||0);
 if(!wage){fieldErr('wg',T('errWage'));return null}
 const profit=Number($('#pf').value||0);
 return {workerId:wid,projectId:$('#pi').value,date:$('#dt').value,hours:Number($('#hr').value||0),wage,profit,type:$('#type').value,note:$('#note').value};
}
function newLog(workerId=''){
 modal(T('newLogTitle'),logForm({},workerId),()=>{
  const v=readLogForm();if(!v)return false;
  const l={id:crypto.randomUUID(),...v};
  db.logs.push(l);window.api.addLog(l);
  const pay=Number($('#pay').value||0);
  if(pay){const pm={id:crypto.randomUUID(),workerId:v.workerId,date:v.date,amount:pay,note:T('advanceFromLogNote')};db.payments.push(pm);window.api.addPayment(pm);}
  render();refreshWorkerSheet();toast(T('toastLogAdded'));return true});
}
function editLog(id){
 const l=db.logs.find(x=>x.id===id);
 modal(T('editLogTitle'),logForm(l),()=>{
  const v=readLogForm();if(!v)return false;
  Object.assign(l,v);window.api.updateLog(l);render();refreshWorkerSheet();toast(T('toastLogSaved'));return true});
}
function delLog(id){
 const l=db.logs.find(x=>x.id===id);
 confirmBox(T('confirmDeleteLog'),T('confirmDeleteLogBody').replace('{name}',`<b>${esc(workerName(l.workerId))}</b>`).replace('{date}',`<span class="num">${esc(l.date)}</span>`).replace('{amt}',money(l.wage)),()=>{
  db.logs=db.logs.filter(x=>x.id!==id);
  window.api.deleteLog(id);render();refreshWorkerSheet();
  undoToast(T('toastLogDeleted'),()=>{db.logs.push(l);window.api.addLog(l);render();refreshWorkerSheet();toast(T('toastLogRestored'));});
 });
}
function deleteOrphanLogs(workerId){
 const orphans=db.logs.filter(l=>l.workerId===workerId&&(!l.projectId||!db.projects.some(p=>p.id===l.projectId)));
 if(!orphans.length)return;
 confirmBox(T('confirmDeleteOrphans'),T('confirmDeleteOrphansBody').replace('{n}',`<span class="num">${orphans.length}</span>`),()=>{
  const ids=orphans.map(x=>x.id);
  db.logs=db.logs.filter(x=>!ids.includes(x.id));
  ids.forEach(id=>window.api.deleteLog(id));
  closeView();render();workerDetail(workerId);
  undoToast(T('toastOrphansDeleted'),()=>{orphans.forEach(l=>{db.logs.push(l);window.api.addLog(l)});closeView();render();workerDetail(workerId);toast(T('toastOrphansRestored'));});
 });
}

function delPayment(id){

/* ---------- activation (device-locked license) ---------- */
function activationScreen(machineId){
 const wrap=document.createElement('div');wrap.id='activation';
 wrap.innerHTML=`<div class="authbox"><div class="amark">${ic.lock(24)}</div><h2>${T('activationTitle')}</h2><p class="sub">${T('activationHint')}</p>
  <div class="field"><label>${T('deviceCode')}</label><div style="display:flex;gap:8px"><input id="mid" readonly value="${esc(machineId)}" style="flex:1"><button class="btn secondary" id="copyMid" type="button">${T('copyBtn')}</button></div></div>
  ${F('lk',T('activationKey'),`<input id="lk" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="text-align:center;letter-spacing:1px">`)}
  <button class="btn primary wide" id="actGo">${T('activateBtn')}</button>
  <p class="muted" style="text-align:center;margin-top:12px">${T('devWhatsapp')}: <span class="num" dir="ltr">+972 56 947 2423</span></p></div>`;
 document.body.appendChild(wrap);
 $('#copyMid').onclick=()=>{navigator.clipboard.writeText(machineId);toast(T('copyMidToast'));};
 const go=async()=>{
  const key=$('#lk').value.trim();
  if(!key)return fieldErr('lk',T('errActivationKey'));
  const ok=await window.api.activateLicense(key);
  if(!ok)return fieldErr('lk',T('errActivationWrong'));
  wrap.remove();boot();
 };
 $('#actGo').onclick=go;
 wrap.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 const f=wrap.querySelector('input');if(f)f.focus();
}

/* ---------- boot ---------- */
async function boot(){
 /* language loads before anything else renders — the activation screen and login screen
    must already be in the chosen language, not just the app after login */
 LANG=(await window.api.getLang())==='he'?'he':'ar';
 document.documentElement.lang=LANG;
 $('#madeBy').textContent=T('madeBy');
 $('#whatsappLbl').textContent=T('whatsapp');
 const lic=await window.api.licenseState();
 if(!lic.licensed){activationScreen(lic.machineId);return;}
 db=await window.api.getAll();
 try{
  const legacy=localStorage.getItem(KEY);
  if(legacy && !db.workers.length && !db.projects.length && !db.logs.length && !db.payments.length){
   const d=JSON.parse(legacy);
   await window.api.importAll(d);
   db=await window.api.getAll();
   localStorage.removeItem(KEY);
  }
 }catch(e){}
 authScreen(await window.api.authState());
}
boot();
