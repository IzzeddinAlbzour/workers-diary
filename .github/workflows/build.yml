name: build-mac-dmg
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Restore license.js from secret
        run: echo "${{ secrets.LICENSE_JS_B64 }}" | base64 -d > license.js
      - run: npm test
      - run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
